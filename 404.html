<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRUUSHKAA // ARCHIVE_OS v3.1</title>
    <meta name="robots" content="noindex" />
    <!--
        GitHub Pages открывает этот файл для любого несуществующего адреса.
        Раньше здесь лежала полная копия index.html (300+ КБ), теперь — переход на главную.
        На github.io проектный сайт живёт в /<репозиторий>/, иначе — в корне домена.
    -->
    <script>
        (function () {
            var parts = location.pathname.split('/').filter(Boolean);
            var base = '/';
            if (/\.github\.io$/i.test(location.hostname) && parts.length > 0) {
                base = '/' + parts[0] + '/';
                if (location.pathname === base) base = '/'; // сам корень проекта не найден — не зацикливаемся
            }
            location.replace(base + location.search + location.hash);
        })();
    </script>
</head>
<body style="font-family: monospace; padding: 24px;">
    <p>&gt; 404 // ПЕРЕНАПРАВЛЕНИЕ В АРХИВ... <a href="./">ОТКРЫТЬ ГЛАВНУЮ</a></p>
</body>
</html>
