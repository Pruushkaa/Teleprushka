    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        /* ==========================================================================
           STATIC CONFIGURATION (FROM WINDOW.APP_CONFIG / CONFIG.JS)
           ========================================================================== */
        const CONFIG = (typeof window !== 'undefined' && window.APP_CONFIG) ? window.APP_CONFIG : {
            LASTFM_USER: 'Pruushkaa',
            LASTFM_API_KEY: 'ВАШ_LASTFM_API_KEY',

            DISCORD_USER_ID: '655742532772429834',

            SOCIAL_LINKS: {
                TELEGRAM_PERSONAL: 'https://t.me/pruushkaa',
                TELEGRAM_CHANNEL: 'https://t.me/pruuushkaa',
                STEAM: 'https://steamcommunity.com/profiles/76561198905010186/',
                TWITTER: 'https://x.com/LeraSemen0va',
                LASTFM: 'https://www.last.fm/user/pruushkaa'
            }
        };

        const ARCHIVE_CONFIG = CONFIG;

        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx && typeof window !== 'undefined') {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playHover() {
                if (!this.enabled) return;
                try {
                    this.init();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(140, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(45, this.ctx.currentTime + 0.025);
                    gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.025);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.025);
                } catch (e) {}
            }

            playClick() {
                if (!this.enabled) return;
                try {
                    this.init();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(280, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.045);
                    gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.045);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.045);
                } catch (e) {}
            }

            playSuccess() {
                if (!this.enabled) return;
                try {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    [523.25, 659.25, 783.99].forEach((freq, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.055);
                        gain.gain.setValueAtTime(0.07, now + idx * 0.055);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.055 + 0.12);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now + idx * 0.055);
                        osc.stop(now + idx * 0.055 + 0.12);
                    });
                } catch (e) {}
            }
        }

        const sfx = new SoundEngine();

        function triggerGlitchSpike(intensity = 1) {
            window.dispatchEvent(new CustomEvent('glitch-spike', { detail: { intensity } }));
        }

        function copyTextToClipboard(text) {
            try {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.left = "-9999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                return true;
            } catch (err) {
                return false;
            }
        }

        const GlitchCanvas = ({ darkMode }) => {
            const canvasRef = useRef(null);
            const spikeRef = useRef(0);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animationFrameId;

                const handleResize = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                };
                handleResize();
                window.addEventListener('resize', handleResize);

                const handleSpike = (e) => {
                    spikeRef.current = (e.detail?.intensity || 1) * 18;
                };
                window.addEventListener('glitch-spike', handleSpike);

                const render = () => {
                    if (!document.hidden) {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);

                        const gridSize = 48;
                        ctx.strokeStyle = darkMode ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.05)';
                        ctx.lineWidth = 1;

                        for (let x = 0; x < canvas.width; x += gridSize) {
                            ctx.beginPath();
                            ctx.moveTo(x, 0);
                            ctx.lineTo(x, canvas.height);
                            ctx.stroke();
                        }
                        for (let y = 0; y < canvas.height; y += gridSize) {
                            ctx.beginPath();
                            ctx.moveTo(0, y);
                            ctx.lineTo(canvas.width, y);
                            ctx.stroke();
                        }

                        const isSpiking = spikeRef.current > 0;
                        const chance = isSpiking ? 0.85 : 0.03;

                        if (Math.random() < chance) {
                            const count = isSpiking ? Math.ceil(spikeRef.current / 3) : 1;
                            for (let i = 0; i < count; i++) {
                                const gx = Math.random() * canvas.width;
                                const gy = Math.random() * canvas.height;
                                const gw = 40 + Math.random() * 220;
                                const gh = 2 + Math.random() * 14;
                                const colors = ['#FF5722', '#CCFF00', '#00E5FF', '#000000'];
                                ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                                ctx.globalAlpha = isSpiking ? 0.35 : 0.12;
                                ctx.fillRect(gx, gy, gw, gh);
                                ctx.globalAlpha = 1.0;
                            }
                        }

                        if (spikeRef.current > 0) {
                            spikeRef.current -= 1;
                        }
                    }
                    animationFrameId = requestAnimationFrame(render);
                };

                render();
                return () => {
                    window.removeEventListener('resize', handleResize);
                    window.removeEventListener('glitch-spike', handleSpike);
                    cancelAnimationFrame(animationFrameId);
                };
            }, [darkMode]);

            return (
                <canvas
                    ref={canvasRef}
                    className="fixed inset-0 pointer-events-none z-0"
                />
            );
        };

        const GENRE_GRADIENTS = {
            electronic: 'linear-gradient(135deg, #FF5722 0%, #FF8A65 50%, #FFD54F 100%)',
            phonk: 'linear-gradient(135deg, #B388FF 0%, #FF5252 100%)',
            rock: 'linear-gradient(135deg, #FF5722 0%, #FCA5A5 100%)',
            ambient: 'linear-gradient(135deg, #80DEEA 0%, #CCFF00 100%)',
            synthwave: 'linear-gradient(135deg, #F48FB1 0%, #90CAF9 100%)',
            default: 'linear-gradient(135deg, #FFFFFF 0%, #FFF3E0 100%)'
        };

        const FALLBACK_TRACKS = [
            {
                name: "Kerosene",
                artist: "Crystal Castles",
                album: "(III)",
                image: "https://placehold.co/300x300/FF5722/000000?text=CRYSTAL+CASTLES",
                nowPlaying: true,
                duration: 192,
                tags: ["electronic", "witch house", "synthpop"],
                genreKey: "electronic",
                timestamp: "NOW SCR0BBLING"
            },
            {
                name: "resonance",
                artist: "HOME",
                album: "Odyssey",
                image: "https://placehold.co/300x300/00E5FF/000000?text=ODYSSEY",
                nowPlaying: false,
                duration: 212,
                tags: ["synthwave", "chillwave", "electronic"],
                genreKey: "synthwave",
                timestamp: "4m ago"
            }
        ];

        function detectGenreKeyFromTags(tags = []) {
            const joined = tags.join(' ').toLowerCase();
            if (joined.includes('phonk') || joined.includes('memphis') || joined.includes('hip-hop') || joined.includes('rap')) return 'phonk';
            if (joined.includes('synthwave') || joined.includes('retrowave') || joined.includes('chillwave') || joined.includes('vaporwave')) return 'synthwave';
            if (joined.includes('ambient') || joined.includes('idm') || joined.includes('downtempo') || joined.includes('piano') || joined.includes('lo-fi')) return 'ambient';
            if (joined.includes('rock') || joined.includes('metal') || joined.includes('punk') || joined.includes('shoegaze') || joined.includes('indie')) return 'rock';
            if (joined.includes('electronic') || joined.includes('witch house') || joined.includes('techno') || joined.includes('house') || joined.includes('electro')) return 'electronic';
            return 'electronic';
        }

        const LastFmWidget = ({ notify, lastFmApiKey, lastFmUser, isAdmin, onOpenAdmin }) => {
            const [tracks, setTracks] = useState(FALLBACK_TRACKS);
            const [activeIdx, setActiveIdx] = useState(0);
            const [showHistory, setShowHistory] = useState(false);
            const [progress, setProgress] = useState(48);
            const [isPlayingSample, setIsPlayingSample] = useState(false);
            const [loadingSample, setLoadingSample] = useState(false);
            const [sampleUrl, setSampleUrl] = useState(null);
            const [apiStatus, setApiStatus] = useState('STANDBY'); // 'LIVE' | 'OFFLINE' | 'STANDBY' | 'ERROR'
            const [errorMsg, setErrorMsg] = useState(null);
            const audioRef = useRef(null);

            const isKeyConfigured = (key) => {
                if (!key) return false;
                const str = String(key).trim();
                return str && str !== 'ВАШ_LASTFM_API_KEY' && str !== 'YOUR_API_KEY' && str.length >= 16;
            };

            const cleanKey = (lastFmApiKey || CONFIG.LASTFM_API_KEY || '').trim();
            const cleanUser = (lastFmUser || CONFIG.LASTFM_USER || 'Pruushkaa').trim();

            const currentTrack = tracks[activeIdx] || tracks[0];

            useEffect(() => {
                let isMounted = true;

                if (!isKeyConfigured(cleanKey)) {
                    console.warn(`[Last.fm Widget] API-ключ Last.fm не настроен или содержит шаблонную заглушку ("${cleanKey || 'пусто'}"). Укажите валидный API-ключ в config.js (получить бесплатно: https://www.last.fm/api/account/create).`);
                    if (isMounted) {
                        setApiStatus('CONFIG_REQUIRED');
                    }
                    return;
                }

                const fetchLiveScrobble = async () => {
                    try {
                        const url = `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${encodeURIComponent(cleanUser)}&api_key=${encodeURIComponent(cleanKey)}&format=json&limit=4`;
                        const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
                        if (!res.ok) {
                            throw new Error(`Last.fm HTTP ${res.status}`);
                        }
                        const data = await res.json();
                        if (data?.error) {
                            throw new Error(data.message || 'Ошибка Last.fm API');
                        }

                        const rawList = data?.recenttracks?.track;
                        const trackList = Array.isArray(rawList) ? rawList : (rawList ? [rawList] : []);

                        if (trackList.length > 0) {
                            const parsed = trackList.slice(0, 4).map((item, idx) => {
                                const trackName = String(item.name || 'Unknown Track');
                                const artistName = String(item.artist?.['#text'] || item.artist?.name || item.artist || 'Unknown Artist');
                                const albumName = String(item.album?.['#text'] || item.album?.name || 'Single');
                                const isNow = Boolean(item['@attr']?.nowplaying === 'true');
                                const trackUrl = item.url || `https://www.last.fm/music/${encodeURIComponent(artistName)}/_/${encodeURIComponent(trackName)}`;

                                // Извлечение обложки максимального доступного разрешения
                                const images = Array.isArray(item.image) ? item.image : [];
                                const extraLarge = images.find(img => img.size === 'extralarge')?.['#text'];
                                const large = images.find(img => img.size === 'large')?.['#text'];
                                const medium = images.find(img => img.size === 'medium')?.['#text'];
                                let imgUrl = extraLarge || large || medium || (images[images.length - 1]?.['#text']) || '';

                                // Fallback если обложка пустая или дефолтная заглушка Last.fm
                                if (!imgUrl || imgUrl.includes('2a96cbd8b46e442fc41c2b86b821562f')) {
                                    imgUrl = `https://placehold.co/300x300/121212/FF5722?text=${encodeURIComponent(artistName.slice(0, 12))}`;
                                }

                                const dateStr = item.date?.['#text'] || '';

                                return {
                                    name: trackName,
                                    artist: artistName,
                                    album: albumName,
                                    image: imgUrl,
                                    nowPlaying: isNow,
                                    url: trackUrl,
                                    duration: 195,
                                    tags: ['last.fm', isNow ? 'live' : 'recent'],
                                    genreKey: 'electronic',
                                    timestamp: isNow ? 'NOW SCROBBLING' : (dateStr || 'ПОСЛЕДНИЙ ТРЕК')
                                };
                            });

                            if (isMounted) {
                                setTracks(parsed);
                                setApiStatus(parsed[0].nowPlaying ? 'LIVE' : 'OFFLINE');
                                setErrorMsg(null);
                            }
                        }
                    } catch (err) {
                        if (isMounted) {
                            setApiStatus('ERROR');
                            setErrorMsg(err.message || 'Ошибка сети');
                        }
                    }
                };

                fetchLiveScrobble();
                const pollTimer = setInterval(fetchLiveScrobble, ARCHIVE_CONFIG.LASTFM_POLL_INTERVAL_MS || 15000);
                return () => {
                    isMounted = false;
                    clearInterval(pollTimer);
                };
            }, [cleanKey, cleanUser]);

            useEffect(() => {
                const timer = setInterval(() => {
                    setProgress(prev => (prev >= (currentTrack?.duration || 180) ? 0 : prev + 1));
                }, 1000);
                return () => clearInterval(timer);
            }, [currentTrack]);

            useEffect(() => {
                if (audioRef.current) {
                    audioRef.current.pause();
                    audioRef.current = null;
                }
                setIsPlayingSample(false);
                setSampleUrl(null);
                setProgress(32);
            }, [activeIdx]);

            const toggleAudioSample = async () => {
                sfx.playClick();
                triggerGlitchSpike(0.7);

                if (isPlayingSample && audioRef.current) {
                    audioRef.current.pause();
                    setIsPlayingSample(false);
                    return;
                }

                if (sampleUrl && audioRef.current) {
                    audioRef.current.play();
                    setIsPlayingSample(true);
                    return;
                }

                setLoadingSample(true);
                try {
                    const query = encodeURIComponent(`${currentTrack.artist} ${currentTrack.name}`);
                    const res = await fetch(`https://itunes.apple.com/search?term=${query}&entity=song&limit=1`);
                    const data = await res.json();
                    const preview = data?.results?.[0]?.previewUrl;

                    if (preview) {
                        const audio = new Audio(preview);
                        audio.volume = 0.5;
                        audio.onended = () => setIsPlayingSample(false);
                        audioRef.current = audio;
                        setSampleUrl(preview);
                        await audio.play();
                        setIsPlayingSample(true);
                        notify(`ПЛЕЕР: 30С СЭМПЛ ${currentTrack.name.toUpperCase()}`);
                    } else {
                        notify("СЭМПЛ НЕ НАЙДЕН В ITUNES", "warn");
                    }
                } catch (e) {
                    notify("АУДИО-ПОТОК НЕДОСТУПЕН", "warn");
                } finally {
                    setLoadingSample(false);
                }
            };

            const formatTime = (sec) => {
                const m = Math.floor(sec / 60);
                const s = Math.floor(sec % 60);
                return `${m}:${s < 10 ? '0' : ''}${s}`;
            };

            const pct = Math.min(100, Math.round((progress / (currentTrack.duration || 180)) * 100));
            const bgGradient = GENRE_GRADIENTS[currentTrack.genreKey] || GENRE_GRADIENTS.default;
            const isLongTitle = `${currentTrack.name} — ${currentTrack.artist}`.length > 26;

            return (
                <div
                    className="brutal-card p-5 relative overflow-hidden transition-all duration-500 text-black"
                    style={{ background: bgGradient }}
                >
                    {/* Header */}
                    <div className="flex flex-wrap items-center justify-between gap-2 border-b-2 border-black pb-3 mb-4">
                        <div className="flex items-center gap-2">
                            <span className="inline-flex items-center justify-center w-6 h-6 bg-black text-white font-mono text-xs font-bold">
                                <i className="fa-brands fa-lastfm text-[#FF5722]"></i>
                            </span>
                            <span className="font-mono font-extrabold text-xs tracking-wider uppercase bg-white px-2 py-0.5 border-2 border-black">
                                LAST.FM // @{cleanUser}
                            </span>
                            <button
                                onClick={() => {
                                    sfx.playClick();
                                    onOpenAdmin();
                                }}
                                className={`font-mono text-[10px] font-extrabold uppercase px-2 py-0.5 border-2 border-black cursor-pointer transition-transform active:translate-y-0.5 ${
                                    apiStatus === 'LIVE'
                                        ? 'bg-[#CCFF00] text-black'
                                        : apiStatus === 'OFFLINE'
                                        ? 'bg-white text-black'
                                        : apiStatus === 'CONFIG_REQUIRED'
                                        ? 'bg-amber-300 text-black'
                                        : 'bg-red-500 text-white'
                                }`}
                                title="Настроить API-ключ Last.fm"
                            >
                                {apiStatus === 'LIVE'
                                    ? '● LAST.FM: LIVE'
                                    : apiStatus === 'CONFIG_REQUIRED'
                                    ? '⚙ Требуется настройка API'
                                    : apiStatus === 'OFFLINE'
                                    ? '■ LAST.FM: ПОСЛЕДНИЙ ТРЕК'
                                    : '▲ ОШИБКА API'}
                            </button>
                        </div>

                        <div className="flex items-center gap-2">
                            {apiStatus === 'LIVE' ? (
                                <span className="inline-flex items-center gap-1.5 font-mono text-[11px] font-bold px-2.5 py-0.5 border-2 border-black bg-[#CCFF00] text-black">
                                    <span className="w-2 h-2 rounded-full bg-black animate-ping"></span>

        const DiscordWidget = ({ discordId, discordTag, isAdmin, onOpenAdmin, notify }) => {
            const [status, setStatus] = useState('offline');
            const [customText, setCustomText] = useState(CONFIG.DEFAULT_DISCORD_TEXT || 'Автономный режим');
            const [activity, setActivity] = useState(null);

            const [avatarUrl, setAvatarUrl] = useState(null);

            const cleanId = (discordId || CONFIG.DISCORD_USER_ID || '655742532772429834').trim();

            useEffect(() => {
                let isMounted = true;
                if (!cleanId) {
                    if (isMounted) {
                        setIsLive(false);
                    }
                    return;
                }

                const fetchLanyard = async () => {
                    try {
                        const res = await fetch(`https://api.lanyard.rest/v1/users/${encodeURIComponent(cleanId)}`);
                        if (!res.ok) {
                            if (isMounted) {
                                setIsLive(false);
                            }
                            return;
                        }
                        const json = await res.json();
                        const d = json?.data;
                        if (d && isMounted) {
                            setIsLive(true);
                            if (d.discord_status) setStatus(d.discord_status);

                            // Discord avatar
                            if (d.discord_user?.avatar) {
                                const ext = d.discord_user.avatar.startsWith('a_') ? 'gif' : 'png';
                                setAvatarUrl(`https://cdn.discordapp.com/avatars/${d.discord_user.id}/${d.discord_user.avatar}.${ext}?size=128`);
                            }

                            // Custom Status (activity type 4)
                            const customAct = d.activities?.find(a => a.type === 4);
                            if (customAct) {
                                let cStr = '';
                                if (customAct.emoji?.name) cStr += `${customAct.emoji.name} `;
                                if (customAct.state) cStr += customAct.state;
                                setCustomText(cStr.trim() || 'В сети');
                            } else {
                                setCustomText(d.discord_status === 'offline' ? 'Офлайн' : 'В сети');
                            }

                            // Spotify Activity
                            if (d.spotify) {
                                setSpotify({
                                    song: d.spotify.song,
                                    artist: d.spotify.artist,
                                    album: d.spotify.album,
                                    albumArt: d.spotify.album_art_url,
                                    trackId: d.spotify.track_id
                                });
                            } else {
                                setSpotify(null);
                            }

                            // Other activity (Game, stream, app)
                            const nonCustom = d.activities?.filter(a => a.type !== 4 && a.type !== 2) || [];
                            if (nonCustom.length > 0) {
                                const act = nonCustom[0];
                                let aStr = act.name;
                                if (act.details) aStr += ` // ${act.details}`;
                                else if (act.state) aStr += ` (${act.state})`;
                                setActivity(aStr);
                            } else {
                                setActivity(null);
                            }
                        }
                    } catch (e) {
                        if (isMounted) {
                            setIsLive(false);
                        }
                    }
                };

                fetchLanyard();
                const timer = setInterval(fetchLanyard, ARCHIVE_CONFIG.DISCORD_POLL_INTERVAL_MS || 15000);
                return () => {
                    isMounted = false;
                    clearInterval(timer);
                };
            }, [cleanId]);

            const handleCopy = () => {
                sfx.playSuccess();
                triggerGlitchSpike(1.2);
                copyTextToClipboard(discordTag || "pruushkaa");
                setCopied(true);
                setTimeout(() => setCopied(false), 2500);
                notify("DISCORD ТЕГ СКОПИРОВАН В БУФЕР!");

            const badgeMap = {
                online: { label: 'В СЕТИ // ONLINE', bg: 'bg-[#CCFF00] text-black', dot: 'bg-green-600 animate-ping' },
                idle: { label: 'ОТОШЕЛ // IDLE', bg: 'bg-amber-300 text-black', dot: 'bg-amber-600' },
                dnd: { label: 'НЕ БЕСПОКОИТЬ', bg: 'bg-[#FF5722] text-white', dot: 'bg-white' },
                offline: { label: 'ОФЛАЙН // OFFLINE', bg: 'bg-neutral-300 text-black', dot: 'bg-neutral-600' }

            const st = badgeMap[status] || badgeMap.offline;

            return (

                        <div className="flex items-center justify-between border-b-2 border-black pb-2 mb-3">

                        <div className="bg-white border-3 border-black p-3 shadow-[4px_4px_0px_#000] font-mono mb-3">

                                <span className={`inline-flex items-center gap-1.5 text-[10px] font-extrabold px-2 py-0.5 border-2 border-black ${st.bg}`}>

                                    </div>
                                )}
                            </div>

                    </div>

                    <button
                        onClick={handleCopy}
                        onMouseEnter={() => sfx.playHover()}

        const UtilityDeck = ({ notify }) => {
            const [activeTab, setActiveTab] = useState('pomodoro');
            const [timeLeft, setTimeLeft] = useState(25 * 60);
            const [timerRunning, setTimerRunning] = useState(false);
            const [mode, setMode] = useState('WORK');

            useEffect(() => {
                if (!timerRunning) return;
                const timerInterval = setInterval(() => {
                    setTimeLeft((prev) => {
                        if (prev <= 1) {
                            sfx.playSuccess();
                            triggerGlitchSpike(1.5);
                            const nextMode = mode === 'WORK' ? 'BREAK' : 'WORK';
                            setMode(nextMode);
                            setTimerRunning(false);
                            notify(`SESSION COMPLETE! SWITCHED TO ${nextMode} MODE.`);
                            return nextMode === 'WORK' ? 25 * 60 : 5 * 60;
                        }
                        return prev - 1;
                    });
                }, 1000);
                return () => clearInterval(timerInterval);
            }, [timerRunning, mode, notify]);

            const formatPomodoro = (seconds) => {
                const m = String(Math.floor(seconds / 60)).padStart(2, '0');
                const s = String(seconds % 60).padStart(2, '0');
                return `${m}:${s}`;
            };

            const [shadowOffset, setShadowOffset] = useState(6);
            const [borderWidth, setBorderWidth] = useState(3);
            const [shadowColor, setShadowColor] = useState('#000000');
            const [cardColor, setCardColor] = useState('#FF5722');
            const [rawText, setRawText] = useState('pruushkaa_archive // 2026');

            const generatedTailwind = `border-[${borderWidth}px] border-black bg-[${cardColor}] shadow-[${shadowOffset}px_${shadowOffset}px_0px_0px_${shadowColor}]`;

            const [pingHistory, setPingHistory] = useState([18, 22, 19, 24, 17, 21]);
            const [isPinging, setIsPinging] = useState(false);

            const measureServerPing = async () => {
                sfx.playClick();
                setIsPinging(true);
                const start = performance.now();
                try {
                    await fetch(window.location.href, { method: 'HEAD', cache: 'no-store' });
                    const latency = Math.max(4, Math.round(performance.now() - start));
                    setPingHistory(prev => [...prev.slice(-7), latency]);
                    notify(`VPS LATENCY MEASURED: ${latency} ms`);
                } catch (e) {
                    const simulated = Math.floor(15 + Math.random() * 14);
                    setPingHistory(prev => [...prev.slice(-7), simulated]);
                    notify(`PING RESPONSE: ${simulated} ms`);
                } finally {
                    setIsPinging(false);
                }
            };

            return (
                <div className="brutal-card p-5 text-black bg-white">
                    <div className="flex flex-wrap items-center justify-between gap-2 border-b-2 border-black pb-3 mb-4">
                        <div className="flex items-center gap-2">
                            <span className="px-2 py-0.5 bg-[#FF5722] text-white font-mono text-xs font-extrabold border-2 border-black">
                                TOOLBOX.EXE
                            </span>
                            <h2 className="font-extrabold text-base uppercase tracking-tight">
                                ПРИКЛАДНОЙ ТЕРМИНАЛ АРХИВА
                            </h2>
                        </div>

                        <div className="flex flex-wrap gap-1.5 font-mono text-xs">
                            {[
                                { id: 'pomodoro', label: '01. ТАЙМЕР ФОКУСА', icon: 'fa-stopwatch' },
                                { id: 'cssgen', label: '02. BRUTAL CSS / B64', icon: 'fa-code' },
                                { id: 'netping', label: '03. VPS РАДАР', icon: 'fa-satellite-dish' }
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => {
                                        sfx.playClick();
                                        setActiveTab(tab.id);
                                    }}
                                    onMouseEnter={() => sfx.playHover()}
                                    className={`brutal-btn px-2.5 py-1 font-bold uppercase flex items-center gap-1.5 ${
                                        activeTab === tab.id ? 'bg-[#CCFF00] text-black' : 'bg-neutral-100 text-black'
                                    }`}
                                >
                                    <i className={`fa-solid ${tab.icon}`}></i>
                                    <span>{tab.label}</span>
                                </button>
                            ))}
                        </div>
                    </div>

                    {activeTab === 'pomodoro' && (
                        <div className="grid grid-cols-1 md:grid-cols-12 gap-4 items-center">
                            <div className="md:col-span-7 bg-[#F4F0EA] border-3 border-black p-4 shadow-[4px_4px_0px_#000] flex flex-col sm:flex-row items-center justify-between gap-4">

                    sessionStorage.setItem('pruushkaa_admin_session', 'true');
                    notify("ДОСТУП РАЗРЕШЕН: РЕЖИМ ВЛАДЕЛЬЦА АКТИВИРОВАН!");
                    return;
                }
                // Проверяем актуальный пароль на сервере
                try {
                    const res = await fetch(`/api/data?t=${Date.now()}`);
                    if (res.ok) {
                        const srv = await res.json();
                        const srvPass = (srv.adminPass || 'admin').trim();
                        if (cleanInput === srvPass) {
                            setAdminPass(srvPass);
                            try { localStorage.setItem('pruushkaa_admin_pass', srvPass); } catch (e) {}
                            sfx.playSuccess();
                            triggerGlitchSpike(1.8);
                            setIsAdmin(true);
                            sessionStorage.setItem('pruushkaa_admin_session', 'true');

            const handleSaveSettings = (e) => {

                const trimmedKey = keyDraft.trim();

                setLastFmUser(trimmedUser);
                setDiscordStatus(statusDraft);
                setDiscordText(trimmedText);
                setDiscordId(trimmedId);

                    setAdminPass(finalPass);

                        localStorage.setItem('pruushkaa_admin_pass', finalPass);
                        setNewPass('');

                if (onSaveSettingsToDb) {
                    onSaveSettingsToDb({

                        adminPass: finalPass,
                        lastFmApiKey: trimmedKey,

                                            <input
                                                type="text"
                                                value={idDraft}
                                                onChange={(e) => setIdDraft(e.target.value)}
                                                placeholder="Напр: 298347298347..."
                                                className="w-full p-2 border-2 border-black bg-white font-bold focus:outline-none"
                                            />

                                        <input
                                            type="text"
                                            value={userDraft}
                                            onChange={(e) => setUserDraft(e.target.value)}
                                            placeholder="pruushkaa"
                                            className="w-full p-2 border-2 border-black bg-white font-bold focus:outline-none"
                                        />
                                    </div>
                                </div>

                                <div className="p-3 bg-[#F4F0EA] border-2 border-black space-y-2">
                                    <div className="font-extrabold uppercase border-b border-black pb-1">

                                            onClose();

                                    </button>
                                </div>
                            </form>

        const CommandPalette = ({ isOpen, onClose, actions }) => {
            const [query, setQuery] = useState('');
            const inputRef = useRef(null);

            useEffect(() => {
                if (isOpen) {
                    setQuery('');
                    setTimeout(() => inputRef.current?.focus(), 50);
                }
            }, [isOpen]);

            if (!isOpen) return null;

            const filtered = actions.filter(a =>
                a.label.toLowerCase().includes(query.toLowerCase()) ||
                a.cmd.toLowerCase().includes(query.toLowerCase())
            );

            return (
                <div
                    className="fixed inset-0 z-50 bg-black/70 flex items-start justify-center pt-20 p-4 font-mono"
                    onClick={onClose}
                >
                    <div
                        className="bg-white text-black border-4 border-black shadow-[10px_10px_0px_#FF5722] max-w-lg w-full p-4"
                        onClick={(e) => e.stopPropagation()}
                    >
                        <div className="flex items-center justify-between border-b-2 border-black pb-2 mb-3">
                            <span className="font-extrabold text-xs uppercase bg-black text-[#CCFF00] px-2 py-0.5">
                                ARCHIVE_CMD // PALETTE
                            </span>
                            <button
                                onClick={onClose}
                                className="font-extrabold text-xs px-2 py-0.5 border-2 border-black hover:bg-[#FF5722] hover:text-white"
                            >
                                ESC [X]
                            </button>
                        </div>

                        <input
                            ref={inputRef}
                            type="text"
                            value={query}
                            onChange={(e) => setQuery(e.target.value)}
                            placeholder="Введи команду (copy, glitch, theme, ping)..."
                            className="w-full p-2.5 border-3 border-black bg-[#F4F0EA] font-bold text-sm mb-3 focus:outline-none"
                        />

                        <div className="space-y-1.5 max-h-64 overflow-y-auto">
                            {filtered.map((item, idx) => (
                                <button
                                    key={idx}
                                    onClick={() => {
                                        sfx.playClick();
                                        item.run();
                                        onClose();
                                    }}
                                    className="w-full text-left p-2.5 border-2 border-black bg-white hover:bg-[#CCFF00] flex items-center justify-between transition-colors"
                                >
                                    <span className="font-bold text-xs">{item.label}</span>
                                    <span className="text-[10px] bg-black text-white px-1.5 py-0.5 font-bold">
                                        {item.cmd}
                                    </span>
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [sfxEnabled, setSfxEnabled] = useState(true);
            const [darkMode, setDarkMode] = useState(false);
            const [toast, setToast] = useState(null);
            const [discordCopied, setDiscordCopied] = useState(false);
            const [cmdOpen, setCmdOpen] = useState(false);
            const [adminModalOpen, setAdminModalOpen] = useState(false);
            const [visitorCount, setVisitorCount] = useState(1428);
            const [activeSection, setActiveSection] = useState('ALL');

            const [isAdmin, setIsAdmin] = useState(() => {
                try {
                    return sessionStorage.getItem('pruushkaa_admin_session') === 'true';
                } catch (e) {
                    return false;
                }
            });

            const [adminPass, setAdminPass] = useState(() => {
                try {
                    return localStorage.getItem('pruushkaa_admin_pass') || ARCHIVE_CONFIG.DEFAULT_ADMIN_PASSWORD;
                } catch (e) {
                    return ARCHIVE_CONFIG.DEFAULT_ADMIN_PASSWORD;
                }
            });

            const [lastFmApiKey, setLastFmApiKey] = useState(CONFIG.LASTFM_API_KEY || '');
            const [lastFmUser, setLastFmUser] = useState(CONFIG.LASTFM_USER || 'Pruushkaa');
            const [discordStatus, setDiscordStatus] = useState(CONFIG.DEFAULT_DISCORD_STATUS || 'offline');
            const [discordText, setDiscordText] = useState(CONFIG.DEFAULT_DISCORD_TEXT || 'Автономный режим');
            const [discordId, setDiscordId] = useState(CONFIG.DISCORD_USER_ID || '655742532772429834');

            const [photos, setPhotos] = useState(() => {
                try {
                    const saved = localStorage.getItem('pruushkaa_photos_v2');
                    return saved ? JSON.parse(saved) : INITIAL_PHOTOS;
                } catch (e) {
                    return INITIAL_PHOTOS;
                }
            });

            const [wikiArticles, setWikiArticles] = useState(() => {
                try {
                    const saved = localStorage.getItem('pruushkaa_wiki_v2');
                    return saved ? JSON.parse(saved) : INITIAL_WIKI_ARTICLES;
                } catch (e) {
                    return INITIAL_WIKI_ARTICLES;
                }
            });

            const discordTag = "pruushkaa";

            const notify = useCallback((msg, type = "info") => {
                setToast({ msg, type });
                setTimeout(() => {
                    setToast((current) => (current?.msg === msg ? null : current));
                }, 3200);
            }, []);

            useEffect(() => {
                let isMounted = true;

                const loadServerDatabase = async () => {
                    if (window.location.protocol === 'file:') return;
                    const bust = `t=${Date.now()}`;
                    const endpoints = [`./database.json?${bust}`, `database.json?${bust}`, `/api/data?${bust}`, `/database.json?${bust}`];
                    for (const url of endpoints) {
                        try {
                            const res = await fetch(url, {
                                cache: 'no-store',
                                headers: { 'Pragma': 'no-cache', 'Cache-Control': 'no-cache' }
                            });
                            if (!res.ok) continue;
                            const data = await res.json();
                            if (data && isMounted) {
                                if (Array.isArray(data.photos)) {
                                    setPhotos(data.photos);
                                    try { localStorage.setItem('pruushkaa_photos_v2', JSON.stringify(data.photos)); } catch (e) {}
                                }
                                const serverWiki = Array.isArray(data.wiki)
                                    ? data.wiki
                                    : (Array.isArray(data.articles) ? data.articles : null);
                                if (serverWiki) {
                                    setWikiArticles(serverWiki);
                                    try { localStorage.setItem('pruushkaa_wiki_v2', JSON.stringify(serverWiki)); } catch (e) {}
                                }
                                if (data.adminPass) {
                                    setAdminPass(data.adminPass);
                                    try { localStorage.setItem('pruushkaa_admin_pass', data.adminPass); } catch (e) {}
                                }
                                if (data.lastFmApiKey !== undefined && data.lastFmApiKey !== '') {
                                    setLastFmApiKey(data.lastFmApiKey);
                                }
                                if (data.lastFmUser && data.lastFmUser !== '') {
                                    setLastFmUser(data.lastFmUser);
                                }
                                if (data.discord) {
                                    if (data.discord.status) {
                                        setDiscordStatus(data.discord.status);
                                    }
                                    if (data.discord.text) {
                                        setDiscordText(data.discord.text);
                                    }
                                    const dId = data.discord.discordId !== undefined ? data.discord.discordId : data.discord.id;
                                    if (dId !== undefined && dId !== '') {
                                        setDiscordId(dId);
                                    }
                                } else if (data.discordStatus) {
                                    setDiscordText(data.discordStatus);
                                }
                                break;
                            }
                        } catch (err) {}
                    }
                };

                loadServerDatabase();
                const syncInterval = setInterval(loadServerDatabase, 15000);
                return () => {
                    isMounted = false;
                    clearInterval(syncInterval);
                };
            }, []);

            const syncDatabase = useCallback(async (nextPhotos, nextWiki, customPayload) => {
                if (!isAdmin) {
                    notify("ДЛЯ СИНХРОНИЗАЦИИ ТРЕБУЮТСЯ ПРАВА АДМИНИСТРАТОРА", "warn");
                    return;
                }
                const pToSave = (nextPhotos !== null && nextPhotos !== undefined) ? nextPhotos : photos;
                const wToSave = (nextWiki !== null && nextWiki !== undefined) ? nextWiki : wikiArticles;
                const discObj = customPayload?.discord || {
                    status: discordStatus,
                    text: discordText,
                    discordId: discordId,
                    id: discordId
                };
                const authPassToSend = customPayload?.authPass || adminPass;
                const passToSave = customPayload?.adminPass || adminPass;
                const keyToSave = customPayload?.lastFmApiKey !== undefined ? customPayload.lastFmApiKey : lastFmApiKey;
                const userToSave = customPayload?.lastFmUser || lastFmUser;

                try {
                    localStorage.setItem('pruushkaa_photos_v2', JSON.stringify(pToSave));
                    localStorage.setItem('pruushkaa_wiki_v2', JSON.stringify(wToSave));
                    localStorage.setItem('pruushkaa_admin_pass', passToSave);
                } catch (e) {}

                if (window.location.protocol === 'file:') {
                    notify("ВНИМАНИЕ: ОТКРЫТ ЛОКАЛЬНЫЙ ФАЙЛ (FILE://). ОТКРОЙ САЙТ ПО ДОМЕНУ ДЛЯ СИНХРОНИЗАЦИИ!", "warn");
                    return;
                }

                try {
                    const res = await fetch(`/api/data?t=${Date.now()}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'x-admin-password': authPassToSend
                        },
                        body: JSON.stringify({
                            authPass: authPassToSend,
                            password: authPassToSend,
                            adminPass: passToSave,
                            lastFmApiKey: keyToSave,
                            lastFmUser: userToSave,
                            photos: pToSave,
                            wiki: wToSave,
                            articles: wToSave,
                            discord: discObj,
                            discordStatus: discObj.text
                        })
                    });

                    if (res.ok) {
                        notify("СОХРАНЕНО В DATABASE.JSON НА СЕРВЕРЕ (ДЛЯ ВСЕХ УСТРОЙСТВ)!");
                    } else {
                        const errData = await res.json().catch(() => ({}));
                        notify(`ОШИБКА СЕРВЕРА (${res.status}): ${errData.error || 'ПРОВЕРЬ СЕРВЕР'}`, "warn");
                    }
                } catch (e) {
                    notify("ОШИБКА СЕТИ: БЭКЕНД /API/DATA НЕДОСТУПЕН", "warn");
                }
            }, [photos, wikiArticles, discordStatus, discordText, discordId, isAdmin, adminPass, lastFmApiKey, lastFmUser, notify]);


            useEffect(() => {
                if (darkMode) {
                    document.body.classList.add('theme-cyber');
                } else {
                    document.body.classList.remove('theme-cyber');
                }
            }, [darkMode]);

            useEffect(() => {
                const onKeyDown = (e) => {
                    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                        e.preventDefault();
                        sfx.playClick();
                        setCmdOpen(prev => !prev);
                    } else if (e.key === 'Escape') {
                        setCmdOpen(false);
                    }
                };
                window.addEventListener('keydown', onKeyDown);
                return () => window.removeEventListener('keydown', onKeyDown);
            }, []);

            const handleCopyDiscord = () => {
                sfx.playSuccess();
                triggerGlitchSpike(1.2);
                copyTextToClipboard(discordTag);
                setDiscordCopied(true);
                notify(`DISCORD TAG "${discordTag}" COPIED TO CLIPBOARD!`);
                setTimeout(() => setDiscordCopied(false), 2500);
            };

            const toggleSfx = () => {
                const next = !sfxEnabled;
                sfx.enabled = next;
                setSfxEnabled(next);
                if (next) sfx.playSuccess();
                notify(`PROCEDURAL AUDIO SFX: ${next ? 'ENABLED' : 'MUTED'}`);
            };

            const commandActions = [
                {
                    label: isAdmin ? "Открыть настройки владельца и API ключа Last.fm" : "Войти по паролю администратора (Разблокировать редактор)",
                    cmd: "admin --auth",
                    run: () => setAdminModalOpen(true)
                },
                {
                    label: "Открыть раздел: ФОТОАРХИВ",
                    cmd: "view --photos",
                    run: () => {
                        setActiveSection('PHOTOS');
                        notify("ПЕРЕКЛЮЧЕНО НА ФОТОАРХИВ");
                    }
                },
                {
                    label: "Открыть раздел: ВИКИ СРП",
                    cmd: "view --wiki",
                    run: () => {
                        setActiveSection('WIKI');
                        notify("ПЕРЕКЛЮЧЕНО НА ВИКИ СРП");
                    }
                },
                {
                    label: "Показать все блоки портфолио",
                    cmd: "view --all",
                    run: () => {
                        setActiveSection('ALL');
                        notify("ОТОБРАЖЕНЫ ВСЕ МОДУЛИ АРХИВА");
                    }
                },
                {
                    label: "Открыть личный Телеграм",
                    cmd: "social --tg-dm",
                    run: () => {
                        window.open(ARCHIVE_CONFIG.SOCIAL_LINKS.TELEGRAM_PERSONAL, '_blank', 'noopener,noreferrer');
                        notify("ОТКРЫВАЮ ЛИЧНЫЙ ТЕЛЕГРАМ...");
                    }
                },
                {
                    label: "Открыть Телеграм-канал",
                    cmd: "social --tg",
                    run: () => {
                        window.open(ARCHIVE_CONFIG.SOCIAL_LINKS.TELEGRAM_CHANNEL, '_blank', 'noopener,noreferrer');
                        notify("ОТКРЫВАЮ ТЕЛЕГРАМ-КАНАЛ...");
                    }
                },
                {
                    label: "Открыть Steam профиль",
                    cmd: "social --steam",
                    run: () => {
                        window.open(ARCHIVE_CONFIG.SOCIAL_LINKS.STEAM, '_blank', 'noopener,noreferrer');
                        notify("ОТКРЫВАЮ STEAM...");
                    }
                },
                {
                    label: "Открыть Twitter (X)",
                    cmd: "social --twitter",
                    run: () => {
                        window.open(ARCHIVE_CONFIG.SOCIAL_LINKS.TWITTER, '_blank', 'noopener,noreferrer');
                        notify("ОТКРЫВАЮ TWITTER...");
                    }
                },
                {
                    label: "Скопировать ник в Discord (pruushkaa)",
                    cmd: "discord / copy",
                    run: handleCopyDiscord
                },
                {
                    label: "Вызвать Glitch-импульс на Canvas",
                    cmd: "glitch --max",
                    run: () => {
                        triggerGlitchSpike(3.0);
                        notify("CANVAS GLITCH OVERDRIVE TRIGGERED!");
                    }
                },
                {
                    label: "Переключить тему оформления (Light / Cyber)",
                    cmd: "theme --toggle",
                    run: () => {
                        setDarkMode(d => !d);
                        notify("ARCHIVE VISUAL THEME UPDATED");
                    }
                },
                {
                    label: "Включить / Выключить звуки кликов",
                    cmd: "sfx --mute",
                    run: toggleSfx
                }
            ];

            return (
                <div className="relative z-10 max-w-5xl mx-auto px-4 sm:px-6 py-6 sm:py-10">
                    <GlitchCanvas darkMode={darkMode} />

                    {toast && (
                        <div className="fixed bottom-5 right-5 z-50 bg-black text-[#CCFF00] border-3 border-white shadow-[6px_6px_0px_#FF5722] px-4 py-3 font-mono text-xs font-extrabold uppercase flex items-center gap-3 animate-bounce">
                            <i className="fa-solid fa-terminal text-[#FF5722]"></i>
                            <span>{toast.msg}</span>
                        </div>
                    )}

                    <CommandPalette
                        isOpen={cmdOpen}
                        onClose={() => setCmdOpen(false)}
                        actions={commandActions}
                    />

                    <AdminModal
                        isOpen={adminModalOpen}
                        onClose={() => setAdminModalOpen(false)}
                        isAdmin={isAdmin}
                        setIsAdmin={setIsAdmin}
                        adminPass={adminPass}
                        setAdminPass={setAdminPass}
                        lastFmApiKey={lastFmApiKey}
                        setLastFmApiKey={setLastFmApiKey}
                        lastFmUser={lastFmUser}
                        setLastFmUser={setLastFmUser}
                        discordStatus={discordStatus}
                        setDiscordStatus={setDiscordStatus}
                        discordText={discordText}
                        setDiscordText={setDiscordText}
                        discordId={discordId}
                        setDiscordId={setDiscordId}
                        onSaveSettingsToDb={(payload) => syncDatabase(null, null, payload)}
                        notify={notify}
                    />

                    <header className="brutal-card p-3 sm:p-4 mb-4 flex flex-wrap items-center justify-between gap-3 bg-white text-black">
                        <div className="flex items-center gap-3">
                            <div
                                onClick={() => {
                                    sfx.playClick();
                                    triggerGlitchSpike(1.5);
                                }}
                                className="w-10 h-10 bg-[#FF5722] border-2 border-black flex items-center justify-center font-mono font-extrabold text-white text-lg cursor-pointer shadow-[3px_3px_0px_#000] active:translate-x-0.5 active:translate-y-0.5"
                                title="Click for Glitch"
                            >
                                P//A
                            </div>
                            <div>
                                <div className="font-extrabold text-base sm:text-lg tracking-tight leading-none flex items-center gap-2">
                                    <span>PRUUSHKAA_ARCHIVE</span>
                                    <span className="text-[10px] font-mono bg-[#CCFF00] px-1.5 py-0.5 border border-black">
                                        v3.0
                                    </span>
                                </div>
                                <div className="font-mono text-[11px] text-neutral-600 font-bold">
                                    SYS_STATUS: ONLINE // {isAdmin ? 'ROOT_MODE: UNLOCKED' : 'READ_ONLY_MODE'}
                                </div>
                            </div>
                        </div>

                        <div className="flex flex-wrap items-center gap-2 font-mono text-xs">
                            <button
                                onClick={() => {
                                    sfx.playClick();
                                    setAdminModalOpen(true);
                                }}
                                onMouseEnter={() => sfx.playHover()}
                                className={`brutal-btn px-3 py-1.5 font-extrabold flex items-center gap-1.5 ${
                                    isAdmin ? 'bg-[#CCFF00] text-black' : 'bg-[#FF5722] text-white'
                                }`}
                                title="Авторизация владельца и настройка Last.fm API"
                            >
                                <i className={`fa-solid ${isAdmin ? 'fa-unlock' : 'fa-lock'}`}></i>
                                <span>{isAdmin ? 'ADMIN: ON' : 'ADMIN'}</span>
                            </button>

                            <button
                                onClick={() => {
                                    sfx.playClick();
                                    setCmdOpen(true);
                                }}
                                onMouseEnter={() => sfx.playHover()}
                                className="brutal-btn bg-[#F4F0EA] px-3 py-1.5 font-bold flex items-center gap-2"
                            >
                                <i className="fa-solid fa-terminal text-[#FF5722]"></i>
                                <span>CMD</span>
                                <kbd className="bg-black text-white px-1 text-[10px]">CTRL+K</kbd>
                            </button>

                            <button
                                onClick={toggleSfx}
                                onMouseEnter={() => sfx.playHover()}
                                className={`brutal-btn px-3 py-1.5 font-bold ${
                                    sfxEnabled ? 'bg-[#CCFF00] text-black' : 'bg-neutral-200 text-neutral-600'
                                }`}
                            >
                                <i className={`fa-solid ${sfxEnabled ? 'fa-volume-high' : 'fa-volume-xmark'} mr-1`}></i>
                                SFX: {sfxEnabled ? 'ON' : 'OFF'}
                            </button>

                            <button
                                onClick={() => {
                                    sfx.playClick();
                                    setDarkMode(!darkMode);
                                    triggerGlitchSpike(0.8);
                                }}
                                onMouseEnter={() => sfx.playHover()}
                                className="brutal-btn bg-black text-white px-3 py-1.5 font-bold"
                            >
                                {darkMode ? '☀ LIGHT' : '☾ CYBER'}
                            </button>
                        </div>
                    </header>

                    <nav className="brutal-card p-2.5 mb-6 bg-white text-black flex flex-wrap items-center justify-between gap-2 font-mono text-xs">
                        <div className="flex flex-wrap items-center gap-2">
                            {[
                                { id: 'ALL', label: 'ВСЕ БЛОКИ', icon: 'fa-layer-group' },
                                { id: 'PHOTOS', label: `ФОТОАРХИВ (${photos.length})`, icon: 'fa-camera-retro' },
                                { id: 'WIKI', label: `ВИКИ СРП (${wikiArticles.length})`, icon: 'fa-book-journal-whills' },
                                { id: 'TOOLS', label: 'ТЕРМИНАЛ УТИЛИТ', icon: 'fa-screwdriver-wrench' }
                            ].map((tab) => (
                                <button
                                    key={tab.id}
                                    onClick={() => {
                                        sfx.playClick();
                                        setActiveSection(tab.id);
                                        triggerGlitchSpike(0.5);
                                    }}
                                    onMouseEnter={() => sfx.playHover()}
                                    className={`brutal-btn px-3 py-1.5 font-extrabold uppercase flex items-center gap-1.5 ${
                                        activeSection === tab.id ? 'bg-[#FF5722] text-white' : 'bg-[#F4F0EA] text-black'
                                    }`}
                                >
                                    <i className={`fa-solid ${tab.icon}`}></i>
                                    <span>{tab.label}</span>
                                </button>
                            ))}
                        </div>

                        <button
                            onClick={() => {
                                sfx.playSuccess();
                                const dump = JSON.stringify({
                                    adminPass,
                                    lastFmApiKey,
                                    lastFmUser,
                                    discord: { status: discordStatus, text: discordText, discordId },
                                    photos,
                                    wiki: wikiArticles
                                }, null, 2);
                                const blob = new Blob([dump], { type: 'application/json' });
                                const url = URL.createObjectURL(blob);
                                const a = document.createElement('a');
                                a.href = url;
                                a.download = 'database.json';
                                a.click();
                                URL.revokeObjectURL(url);
                                notify("ПОЛНАЯ БАЗА DATABASE.JSON ВЫГРУЖЕНА!");
                            }}
                            onMouseEnter={() => sfx.playHover()}
                            className="brutal-btn bg-[#CCFF00] text-black px-3 py-1.5 font-extrabold uppercase flex items-center gap-1.5"
                            title="Скачать резервную копию database.json"
                        >
                            <i className="fa-solid fa-file-export"></i> ЭКСПОРТ DB.JSON
                        </button>
                    </nav>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 mb-6">
                        <div className="lg:col-span-8 brutal-card p-6 bg-white text-black relative flex flex-col justify-between">
                            <div className="flex flex-col sm:flex-row items-start sm:items-center gap-5 mb-5">
                                <div className="w-24 h-24 sm:w-28 sm:h-28 rounded-none border-4 border-black shadow-[5px_5px_0px_#FF5722] overflow-hidden shrink-0 bg-neutral-900">
                                    <img
                                        src="image_718c24.jpg"
                                        alt="Pruushkaa Avatar"
                                        onError={(e) => {
                                            e.target.onerror = null;
                                            e.target.src = "https://placehold.co/300x300/121212/CCFF00?text=PRUUSHKAA";
                                        }}
                                        className="w-full h-full object-cover"
                                    />
                                </div>

                                <div>
                                    <div className="inline-block font-mono text-xs font-extrabold uppercase bg-[#FF5722] text-white px-2.5 py-0.5 border-2 border-black mb-2">
                                        DIGITAL ARCHIVE // DEVELOPER
                                    </div>
                                    <h1 className="text-3xl sm:text-5xl font-extrabold tracking-tight leading-none mb-2">
                                        PRUUSHKAA
                                    </h1>
                                    <p className="font-mono text-xs sm:text-sm text-neutral-700 font-bold max-w-xl">
                                        Личный цифровой архив, фотохроника, база знаний Вики СРП и живая музыкальная телеметрия.
                                    </p>
                                </div>
                            </div>

                            <div className="pt-4 border-t-2 border-black grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-2.5 font-mono text-xs">
                                <a
                                    href={ARCHIVE_CONFIG.SOCIAL_LINKS.TELEGRAM_PERSONAL}
                                    target="_blank"
                                    rel="noreferrer"
                                    onMouseEnter={() => sfx.playHover()}
                                    onClick={() => sfx.playClick()}
                                    className="brutal-btn bg-[#CCFF00] text-black py-2.5 px-2.5 font-extrabold flex items-center justify-center gap-1.5"
                                >
                                    <i className="fa-solid fa-paper-plane text-sm"></i> ТЕЛЕГРАМ
                                </a>
                                <a
                                    href={ARCHIVE_CONFIG.SOCIAL_LINKS.TELEGRAM_CHANNEL}
                                    target="_blank"
                                    rel="noreferrer"
                                    onMouseEnter={() => sfx.playHover()}
                                    onClick={() => sfx.playClick()}
                                    className="brutal-btn bg-[#00E5FF] text-black py-2.5 px-2.5 font-extrabold flex items-center justify-center gap-1.5"
                                >
                                    <i className="fa-brands fa-telegram text-base"></i> ТГ КАНАЛ
                                </a>
                                <a
                                    href={ARCHIVE_CONFIG.SOCIAL_LINKS.STEAM}
                                    target="_blank"
                                    rel="noreferrer"
                                    onMouseEnter={() => sfx.playHover()}
                                    onClick={() => sfx.playClick()}
                                    className="brutal-btn bg-[#F4F0EA] text-black py-2.5 px-2.5 font-extrabold flex items-center justify-center gap-1.5"
                                >
                                    <i className="fa-brands fa-steam text-base"></i> STEAM
                                </a>
                                <a
                                    href={ARCHIVE_CONFIG.SOCIAL_LINKS.TWITTER}
                                    target="_blank"
                                    rel="noreferrer"
                                    onMouseEnter={() => sfx.playHover()}
                                    onClick={() => sfx.playClick()}
                                    className="brutal-btn bg-black text-[#CCFF00] py-2.5 px-2.5 font-extrabold flex items-center justify-center gap-1.5"
                                >
                                    <i className="fa-brands fa-x-twitter text-base"></i> TWITTER
                                </a>
                                <a
                                    href={ARCHIVE_CONFIG.SOCIAL_LINKS.LASTFM}
                                    target="_blank"
                                    rel="noreferrer"
                                    onMouseEnter={() => sfx.playHover()}
                                    onClick={() => sfx.playClick()}
                                    className="brutal-btn bg-[#FF5722] text-white py-2.5 px-2.5 font-extrabold flex items-center justify-center gap-1.5 col-span-2 sm:col-span-1"
                                >
                                    <i className="fa-brands fa-lastfm text-base"></i> LAST.FM
                                </a>
                            </div>
                        </div>

                        <DiscordWidget
                            discordId={discordId}
                            discordTag={ARCHIVE_CONFIG.DISCORD_TAG || "pruushkaa"}
                            isAdmin={isAdmin}
                            onOpenAdmin={() => setAdminModalOpen(true)}
                            notify={notify}
                        />
                    </div>

                    <div className="mb-6">
                        <LastFmWidget
                            notify={notify}
                            lastFmApiKey={lastFmApiKey}
                            lastFmUser={lastFmUser}
                            isAdmin={isAdmin}
                            onOpenAdmin={() => setAdminModalOpen(true)}
                        />
                    </div>

                    {(activeSection === 'ALL' || activeSection === 'PHOTOS') && (
                        <div className="mb-6">
                            <PhotoArchive
                                photos={photos}
                                setPhotos={setPhotos}
                                notify={notify}
                                syncDatabase={syncDatabase}
                                isAdmin={isAdmin}
                                onOpenAdmin={() => setAdminModalOpen(true)}
                            />
                        </div>
                    )}

                    {(activeSection === 'ALL' || activeSection === 'WIKI') && (
                        <div className="mb-6">
                            <SrpWiki
                                articles={wikiArticles}
                                setArticles={setWikiArticles}
                                notify={notify}
                                syncDatabase={syncDatabase}
                                isAdmin={isAdmin}
                                onOpenAdmin={() => setAdminModalOpen(true)}
                            />
                        </div>
                    )}

                    {(activeSection === 'ALL' || activeSection === 'TOOLS') && (
                        <div className="mb-8">
                            <UtilityDeck notify={notify} />
                        </div>
                    )}

                    <footer className="brutal-card p-4 bg-black text-white font-mono text-xs flex flex-col sm:flex-row items-center justify-between gap-2">
                        <div className="flex items-center gap-2">
                            <span className="w-2.5 h-2.5 bg-[#CCFF00] inline-block"></span>
                            <span>PRUUSHKAA_ARCHIVE // NEOBRUTALIST EDITION v3.0</span>
                        </div>
                        <div className="text-neutral-400">
                            VISITORS_LOG: <span className="text-[#FF5722] font-bold">#{visitorCount}</span> // PRESS <span className="text-white underline">CTRL+K</span> FOR TERMINAL
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
