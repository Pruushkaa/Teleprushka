        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx && typeof window !== 'undefined') {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }

            playHover() {
                if (!this.enabled) return;
                try {
                    this.init();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(140, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(45, this.ctx.currentTime + 0.025);
                    gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.025);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.025);
                } catch (e) {}
            }

            playClick() {
                if (!this.enabled) return;
                try {
                    this.init();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();

                    [523.25, 659.25, 783.99].forEach((freq, idx) => {

                        osc.frequency.setValueAtTime(freq, now + idx * 0.055);

                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now + idx * 0.055);
                        osc.stop(now + idx * 0.055 + 0.12);

        function triggerGlitchSpike(intensity = 1) {

        function copyTextToClipboard(text) {

        const GlitchCanvas = ({ darkMode }) => {
            const canvasRef = useRef(null);
            const spikeRef = useRef(0);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animationFrameId;

                const handleResize = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                };
                handleResize();
                window.addEventListener('resize', handleResize);

                const handleSpike = (e) => {
                    spikeRef.current = (e.detail?.intensity || 1) * 18;
                };
                window.addEventListener('glitch-spike', handleSpike);

                const render = () => {
                    if (!document.hidden) {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);

                        const gridSize = 48;
                        ctx.strokeStyle = darkMode ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.05)';
                        ctx.lineWidth = 1;

                        for (let x = 0; x < canvas.width; x += gridSize) {
                            ctx.beginPath();
                            ctx.moveTo(x, 0);
                            ctx.lineTo(x, canvas.height);
                            ctx.stroke();
                        }
                        for (let y = 0; y < canvas.height; y += gridSize) {
                            ctx.beginPath();
                            ctx.moveTo(0, y);
                            ctx.lineTo(canvas.width, y);
                            ctx.stroke();
                        }

                        const isSpiking = spikeRef.current > 0;
                        const chance = isSpiking ? 0.85 : 0.03;

                        if (Math.random() < chance) {
                            const count = isSpiking ? Math.ceil(spikeRef.current / 3) : 1;
                            for (let i = 0; i < count; i++) {
                                const gx = Math.random() * canvas.width;
                                const gy = Math.random() * canvas.height;
                                const gw = 40 + Math.random() * 220;
                                const gh = 2 + Math.random() * 14;
                                const colors = ['#FF5722', '#CCFF00', '#00E5FF', '#000000'];
                                ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                                ctx.globalAlpha = isSpiking ? 0.35 : 0.12;
                                ctx.fillRect(gx, gy, gw, gh);
                                ctx.globalAlpha = 1.0;
                            }
                        }

                        if (spikeRef.current > 0) {
                            spikeRef.current -= 1;
                        }
                    }
                    animationFrameId = requestAnimationFrame(render);
                };

                render();
                return () => {
                    window.removeEventListener('resize', handleResize);
                    window.removeEventListener('glitch-spike', handleSpike);
                    cancelAnimationFrame(animationFrameId);
                };
            }, [darkMode]);

            return (
                <canvas
                    ref={canvasRef}
                    className="fixed inset-0 pointer-events-none z-0"
                />
            );
        };

        function detectGenreKeyFromTags(tags = []) {
            const joined = tags.join(' ').toLowerCase();
            if (joined.includes('phonk') || joined.includes('memphis') || joined.includes('hip-hop') || joined.includes('rap')) return 'phonk';
            if (joined.includes('synthwave') || joined.includes('retrowave') || joined.includes('chillwave') || joined.includes('vaporwave')) return 'synthwave';
            if (joined.includes('ambient') || joined.includes('idm') || joined.includes('downtempo') || joined.includes('piano') || joined.includes('lo-fi')) return 'ambient';
            if (joined.includes('rock') || joined.includes('metal') || joined.includes('punk') || joined.includes('shoegaze') || joined.includes('indie')) return 'rock';
            if (joined.includes('electronic') || joined.includes('witch house') || joined.includes('techno') || joined.includes('house') || joined.includes('electro')) return 'electronic';

        const LastFmWidget = ({ notify, lastFmApiKey, lastFmUser, isAdmin, onOpenAdmin }) => {

            const [activeIdx, setActiveIdx] = useState(0);
            const [showHistory, setShowHistory] = useState(false);
            const [progress, setProgress] = useState(48);

            const [apiStatus, setApiStatus] = useState('STANDBY'); // 'LIVE' | 'OFFLINE' | 'STANDBY' | 'ERROR'
            const [errorMsg, setErrorMsg] = useState(null);
            const audioRef = useRef(null);

            const isKeyConfigured = (key) => {
                if (!key) return false;
                const str = String(key).trim();
                return str && str !== 'ВАШ_LASTFM_API_KEY' && str !== 'YOUR_API_KEY' && str.length >= 16;
            };

            const cleanKey = (lastFmApiKey || CONFIG.LASTFM_API_KEY || '').trim();
            const cleanUser = (lastFmUser || CONFIG.LASTFM_USER || 'Pruushkaa').trim();

            const currentTrack = tracks[activeIdx] || tracks[0];

            useEffect(() => {
                let isMounted = true;

                if (!isKeyConfigured(cleanKey)) {
                    console.warn(`[Last.fm Widget] API-ключ Last.fm не настроен или содержит шаблонную заглушку ("${cleanKey || 'пусто'}"). Укажите валидный API-ключ в config.js (получить бесплатно: https://www.last.fm/api/account/create).`);
                    if (isMounted) {
                        setApiStatus('CONFIG_REQUIRED');
                    }
                    return;
                }

                const fetchLiveScrobble = async () => {
                    try {
                        const url = `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${encodeURIComponent(cleanUser)}&api_key=${encodeURIComponent(cleanKey)}&format=json&limit=4`;
                        const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
                        if (!res.ok) {
                            throw new Error(`Last.fm HTTP ${res.status}`);
                        }
                        const data = await res.json();
                        if (data?.error) {
                            throw new Error(data.message || 'Ошибка Last.fm API');
                        }

                        const rawList = data?.recenttracks?.track;
                        const trackList = Array.isArray(rawList) ? rawList : (rawList ? [rawList] : []);

                        if (trackList.length > 0) {
                            const parsed = trackList.slice(0, 4).map((item, idx) => {
                                const trackName = String(item.name || 'Unknown Track');
                                const artistName = String(item.artist?.['#text'] || item.artist?.name || item.artist || 'Unknown Artist');
                                const albumName = String(item.album?.['#text'] || item.album?.name || 'Single');
                                const isNow = Boolean(item['@attr']?.nowplaying === 'true');
                                const trackUrl = item.url || `https://www.last.fm/music/${encodeURIComponent(artistName)}/_/${encodeURIComponent(trackName)}`;

                                // Извлечение обложки максимального доступного разрешения
                                const images = Array.isArray(item.image) ? item.image : [];
                                const extraLarge = images.find(img => img.size === 'extralarge')?.['#text'];
                                const large = images.find(img => img.size === 'large')?.['#text'];
                                const medium = images.find(img => img.size === 'medium')?.['#text'];
                                let imgUrl = extraLarge || large || medium || (images[images.length - 1]?.['#text']) || '';

                                // Fallback если обложка пустая или дефолтная заглушка Last.fm
                                if (!imgUrl || imgUrl.includes('2a96cbd8b46e442fc41c2b86b821562f')) {
                                    imgUrl = `https://placehold.co/300x300/121212/FF5722?text=${encodeURIComponent(artistName.slice(0, 12))}`;
                                }

                                const dateStr = item.date?.['#text'] || '';

                                return {
                                    name: trackName,
                                    artist: artistName,
                                    album: albumName,
                                    image: imgUrl,
                                    nowPlaying: isNow,
                                    url: trackUrl,
                                    duration: 195,
                                    tags: ['last.fm', isNow ? 'live' : 'recent'],
                                    genreKey: 'electronic',
                                    timestamp: isNow ? 'NOW SCROBBLING' : (dateStr || 'ПОСЛЕДНИЙ ТРЕК')
                                };
                            });

                            if (isMounted) {
                                setTracks(parsed);
                                setApiStatus(parsed[0].nowPlaying ? 'LIVE' : 'OFFLINE');
                                setErrorMsg(null);
                            }
                        }
                    } catch (err) {
                        if (isMounted) {
                            setApiStatus('ERROR');
                            setErrorMsg(err.message || 'Ошибка сети');
                        }
                    }
                };

                fetchLiveScrobble();
                const pollTimer = setInterval(fetchLiveScrobble, ARCHIVE_CONFIG.LASTFM_POLL_INTERVAL_MS || 15000);
                return () => {
                    isMounted = false;
                    clearInterval(pollTimer);

            }, [cleanKey, cleanUser]);

                const timer = setInterval(() => {
                    setProgress(prev => (prev >= (currentTrack?.duration || 180) ? 0 : prev + 1));
                }, 1000);
                return () => clearInterval(timer);
            }, [currentTrack]);

            useEffect(() => {
                if (audioRef.current) {
                    audioRef.current.pause();
                    audioRef.current = null;
                }
                setIsPlayingSample(false);
                setSampleUrl(null);
                setProgress(32);
            }, [activeIdx]);

            const toggleAudioSample = async () => {
                sfx.playClick();
                triggerGlitchSpike(0.7);

                if (isPlayingSample && audioRef.current) {
                    audioRef.current.pause();
                    setIsPlayingSample(false);
                    return;
                }

                if (sampleUrl && audioRef.current) {
                    audioRef.current.play();
                    setIsPlayingSample(true);
                    return;
                }

                setLoadingSample(true);
                try {
                    const query = encodeURIComponent(`${currentTrack.artist} ${currentTrack.name}`);
                    const res = await fetch(`https://itunes.apple.com/search?term=${query}&entity=song&limit=1`);
                    const data = await res.json();
                    const preview = data?.results?.[0]?.previewUrl;

                    if (preview) {
                        const audio = new Audio(preview);
                        audio.volume = 0.5;
                        audio.onended = () => setIsPlayingSample(false);
                        audioRef.current = audio;
                        setSampleUrl(preview);
                        await audio.play();
                        setIsPlayingSample(true);
                        notify(`ПЛЕЕР: 30С СЭМПЛ ${currentTrack.name.toUpperCase()}`);
                    } else {
                        notify("СЭМПЛ НЕ НАЙДЕН В ITUNES", "warn");
                    }
                } catch (e) {
                    notify("АУДИО-ПОТОК НЕДОСТУПЕН", "warn");
                } finally {
                    setLoadingSample(false);
                }
            };

            const formatTime = (sec) => {
                const m = Math.floor(sec / 60);
                const s = Math.floor(sec % 60);
                return `${m}:${s < 10 ? '0' : ''}${s}`;

            const pct = Math.min(100, Math.round((progress / (currentTrack.duration || 180)) * 100));

                                        : 'bg-red-500 text-white'

                                title="Настроить API-ключ Last.fm"
                            >
                                {apiStatus === 'LIVE'
                                    ? '● LAST.FM: LIVE'
                                    : apiStatus === 'CONFIG_REQUIRED'
                                    ? '⚙ Требуется настройка API'
                                    : apiStatus === 'OFFLINE'
                                    ? '■ LAST.FM: ПОСЛЕДНИЙ ТРЕК'

                        <div className="flex items-center gap-2">

                            </div>

                    {/* Main Track Card */}
                    <div className="flex flex-col sm:flex-row gap-4 items-start sm:items-center">

                            <img

                    {/* Scrobble History */}
                    {showHistory && (

                            <div className="font-extrabold uppercase text-[11px] text-neutral-600 mb-1 flex items-center justify-between">
                                <span>ПОСЛЕДНИЕ СКРОББЛЫ (КЛИКНИ ДЛЯ ПЕРЕКЛЮЧЕНИЯ):</span>
                                <span className="text-[10px] text-neutral-500">{tracks.length} ТРЕКА</span>
                            </div>

                                    onClick={() => {
                                        sfx.playClick();
                                        setActiveIdx(idx);
                                    }}
                                    className={`flex items-center justify-between p-2 border-2 border-black cursor-pointer transition-colors ${
                                        idx === activeIdx ? 'bg-[#CCFF00] font-extrabold' : 'bg-white hover:bg-neutral-100'
                                    }`}
                                >
                                    <div className="flex items-center gap-2.5 truncate">
                                        <span className="px-1.5 py-0.5 bg-black text-white text-[10px]">0{idx + 1}</span>
                                        <span className="truncate">{t.artist} — {t.name}</span>
                                    </div>
                                    <span className="text-[10px] shrink-0 ml-2 px-1.5 py-0.5 border border-black bg-white">
                                        {t.timestamp}
                                    </span>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const DiscordWidget = ({ discordId, discordTag, isAdmin, onOpenAdmin, notify }) => {
            const [status, setStatus] = useState('offline');
            const [customText, setCustomText] = useState(CONFIG.DEFAULT_DISCORD_TEXT || 'Автономный режим');
            const [activity, setActivity] = useState(null);
            const [spotify, setSpotify] = useState(null);
            const [avatarUrl, setAvatarUrl] = useState(null);
            const [isLive, setIsLive] = useState(false);
            const [copied, setCopied] = useState(false);

            const cleanId = (discordId || CONFIG.DISCORD_USER_ID || '655742532772429834').trim();

            useEffect(() => {
                let isMounted = true;
                if (!cleanId) {
                    if (isMounted) {
                        setIsLive(false);
                    }
                    return;
                }

                const fetchLanyard = async () => {
                    try {
                        const res = await fetch(`https://api.lanyard.rest/v1/users/${encodeURIComponent(cleanId)}`);
                        if (!res.ok) {
                            if (isMounted) {
                                setIsLive(false);
                            }
                            return;
                        }
                        const json = await res.json();
                        const d = json?.data;
                        if (d && isMounted) {
                            setIsLive(true);
                            if (d.discord_status) setStatus(d.discord_status);

                            // Discord avatar
                            if (d.discord_user?.avatar) {
                                const ext = d.discord_user.avatar.startsWith('a_') ? 'gif' : 'png';
                                setAvatarUrl(`https://cdn.discordapp.com/avatars/${d.discord_user.id}/${d.discord_user.avatar}.${ext}?size=128`);
                            }

                            // Custom Status (activity type 4)
                            const customAct = d.activities?.find(a => a.type === 4);
                            if (customAct) {
                                let cStr = '';
                                if (customAct.emoji?.name) cStr += `${customAct.emoji.name} `;
                                if (customAct.state) cStr += customAct.state;
                                setCustomText(cStr.trim() || 'В сети');
                            } else {
                                setCustomText(d.discord_status === 'offline' ? 'Офлайн' : 'В сети');
                            }

                            // Spotify Activity
                            if (d.spotify) {
                                setSpotify({
                                    song: d.spotify.song,
                                    artist: d.spotify.artist,
                                    album: d.spotify.album,
                                    albumArt: d.spotify.album_art_url,
                                    trackId: d.spotify.track_id
                                });
                            } else {
                                setSpotify(null);
                            }

                            // Other activity (Game, stream, app)
                            const nonCustom = d.activities?.filter(a => a.type !== 4 && a.type !== 2) || [];
                            if (nonCustom.length > 0) {
                                const act = nonCustom[0];
                                let aStr = act.name;
                                if (act.details) aStr += ` // ${act.details}`;
                                else if (act.state) aStr += ` (${act.state})`;
                                setActivity(aStr);
                            } else {
                                setActivity(null);
                            }
                        }
                    } catch (e) {
                        if (isMounted) {
                            setIsLive(false);
                        }
                    }
                };

                fetchLanyard();
                const timer = setInterval(fetchLanyard, ARCHIVE_CONFIG.DISCORD_POLL_INTERVAL_MS || 15000);
                return () => {
                    isMounted = false;
                    clearInterval(timer);
                };
            }, [cleanId]);

            const handleCopy = () => {
                sfx.playSuccess();
                triggerGlitchSpike(1.2);
                copyTextToClipboard(discordTag || "pruushkaa");
                setCopied(true);
                setTimeout(() => setCopied(false), 2500);
                notify("DISCORD ТЕГ СКОПИРОВАН В БУФЕР!");
            };

            const badgeMap = {
                online: { label: 'В СЕТИ // ONLINE', bg: 'bg-[#CCFF00] text-black', dot: 'bg-green-600 animate-ping' },
                idle: { label: 'ОТОШЕЛ // IDLE', bg: 'bg-amber-300 text-black', dot: 'bg-amber-600' },
                dnd: { label: 'НЕ БЕСПОКОИТЬ', bg: 'bg-[#FF5722] text-white', dot: 'bg-white' },
                offline: { label: 'ОФЛАЙН // OFFLINE', bg: 'bg-neutral-300 text-black', dot: 'bg-neutral-600' }
            };
            const st = badgeMap[status] || badgeMap.offline;

            return (
                <div className="lg:col-span-4 brutal-card p-5 bg-[#B388FF] text-black flex flex-col justify-between">
                    <div>
                        <div className="flex items-center justify-between border-b-2 border-black pb-2 mb-3">
                            <span className="font-mono text-xs font-extrabold uppercase bg-white px-2 py-0.5 border-2 border-black">

                            <div className="flex items-center gap-1.5">
                                {isLive ? (

                                    </button>
                                )}
                                <i className="fa-brands fa-discord text-2xl"></i>
                            </div>
                        </div>

                        <div className="bg-white border-3 border-black p-3 shadow-[4px_4px_0px_#000] font-mono mb-3">
                            <div className="flex items-center justify-between mb-2">
                                <div className="flex items-center gap-2">
                                    {avatarUrl ? (
                                        <img src={avatarUrl} alt="Avatar" className="w-7 h-7 rounded-full border-2 border-black object-cover" />
                                    ) : (
                                        <div className="w-7 h-7 bg-neutral-200 border-2 border-black rounded-full flex items-center justify-center text-xs">
                                            <i className="fa-solid fa-user text-neutral-600"></i>
                                        </div>
                                    )}
                                    <span className="text-lg font-extrabold tracking-tight">@{discordTag}</span>
                                </div>
                                <span className={`inline-flex items-center gap-1.5 text-[10px] font-extrabold px-2 py-0.5 border-2 border-black ${st.bg}`}>
                                    <span className={`w-2 h-2 rounded-full ${st.dot}`}></span>
                                    {st.label}
                                </span>
                            </div>

                            <div className="border-t-2 border-black pt-2 mt-1 text-xs">
                                <div className="text-[10px] font-extrabold uppercase text-neutral-500 mb-0.5 flex items-center justify-between">
                                    <span>СТАТУС:</span>

                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    <button
                        onClick={handleCopy}
                        onMouseEnter={() => sfx.playHover()}
                        className={`brutal-btn w-full py-2.5 font-mono text-xs font-extrabold uppercase flex items-center justify-center gap-2 ${

                    >
                        <i className={`fa-solid ${copied ? 'fa-check' : 'fa-copy'}`}></i>
                        {copied ? "СКОПИРОВАНО В БУФЕР!" : "СКОПИРОВАТЬ DISCORD ТЕГ"}
                    </button>
                </div>
            );
        };

        const UtilityDeck = ({ notify }) => {
            const [activeTab, setActiveTab] = useState('pomodoro');
            const [timeLeft, setTimeLeft] = useState(25 * 60);
            const [timerRunning, setTimerRunning] = useState(false);
            const [mode, setMode] = useState('WORK');

            useEffect(() => {
                if (!timerRunning) return;
                const timerInterval = setInterval(() => {
                    setTimeLeft((prev) => {
                        if (prev <= 1) {
                            sfx.playSuccess();
                            triggerGlitchSpike(1.5);
                            const nextMode = mode === 'WORK' ? 'BREAK' : 'WORK';
                            setMode(nextMode);
                            setTimerRunning(false);
                            notify(`SESSION COMPLETE! SWITCHED TO ${nextMode} MODE.`);
                            return nextMode === 'WORK' ? 25 * 60 : 5 * 60;
                        }
                        return prev - 1;
                    });
                }, 1000);
                return () => clearInterval(timerInterval);
            }, [timerRunning, mode, notify]);

            const formatPomodoro = (seconds) => {
                const m = String(Math.floor(seconds / 60)).padStart(2, '0');

        function renderWikiMarkdown(content) {
            if (!content) return '';

            const formatInline = (str) => {
                if (!str) return '';
                return str
                    .replace(/\*\*(.*?)\*\*/g, '<strong class="font-black text-black bg-neutral-100 px-0.5">$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em class="italic">$1</em>')
                    .replace(/`([^`]+)`/g, '<code class="bg-black text-[#CCFF00] px-1 py-0.5 text-xs font-mono">$1</code>')
                    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer" class="text-[#FF5722] underline font-extrabold hover:text-black">$1</a>');
            };

            const rawLines = content.replace(/\r\n/g, '\n').split('\n');
            const htmlParts = [];
            let inList = false;
            let listType = 'ul';

            for (let i = 0; i < rawLines.length; i++) {
                const line = rawLines[i];
                const trimmed = line.trim();

                // 1. Image check: ![alt](url)
                const imgMatch = trimmed.match(/^!\[(.*?)\]\((.*?)\)$/);
                if (imgMatch) {
                    if (inList) { htmlParts.push(`</${listType}>`); inList = false; }
                    const alt = (imgMatch[1] || 'Иллюстрация архива СРП').trim();
                    const src = imgMatch[2].trim();
                    htmlParts.push(`
                        <div class="my-5 p-2.5 bg-[#F4F0EA] border-3 border-black shadow-[4px_4px_0px_#000]">
                            <div class="overflow-hidden bg-neutral-950 flex items-center justify-center border-2 border-black max-h-[520px]">
                                <img 
                                    src="${src}" 
                                    alt="${alt}" 
                                    class="w-full max-h-[500px] object-contain hover:scale-[1.01] transition-transform cursor-pointer"
                                    loading="lazy"
                                />
                            </div>
                            <div class="mt-2 flex items-center justify-between font-mono text-[11px] font-bold text-neutral-700 px-1">
                                <span>▲ ${alt}</span>
                                <span class="text-[10px] text-[#FF5722] uppercase font-extrabold">КЛИК ДЛЯ УВЕЛИЧЕНИЯ ⤢</span>
                            </div>
                        </div>
                    `);
                    continue;
                }

                // 2. Heading: # Heading or **# Heading** or ## Heading
                const headingMatch = trimmed.match(/^(?:\*\*)?(#{1,4})\s+(.*?)(?:\*\*)?$/);
                if (headingMatch) {
                    if (inList) { htmlParts.push(`</${listType}>`); inList = false; }
                    const level = headingMatch[1].length;
                    const hText = headingMatch[2].replace(/^\*+|\*+$/g, '').trim();
                    if (level === 1) {
                        htmlParts.push(`
                            <h1 class="text-xl sm:text-2xl font-black uppercase tracking-tight mt-6 mb-3 pb-2 border-b-3 border-black flex items-center gap-2">
                                <span class="w-3 h-3 bg-[#FF5722] border-2 border-black inline-block shrink-0"></span>
                                <span>${hText}</span>
                            </h1>
                        `);
                    } else if (level === 2) {
                        htmlParts.push(`
                            <h2 class="text-lg sm:text-xl font-black uppercase tracking-tight mt-5 mb-2.5 pb-1 border-b-2 border-black text-[#FF5722] flex items-center gap-2">
                                <span>// ${hText}</span>
                            </h2>
                        `);
                    } else {
                        htmlParts.push(`
                            <h3 class="text-base sm:text-lg font-extrabold uppercase mt-4 mb-2 text-black">
                                ${hText}
                            </h3>
                        `);
                    }
                    continue;
                }

                // 3. Unordered list: - item or * item or • item
                const ulMatch = trimmed.match(/^[-*•]\s+(.*)$/);
                if (ulMatch) {
                    if (!inList || listType !== 'ul') {
                        if (inList) htmlParts.push(`</${listType}>`);
                        htmlParts.push('<ul class="list-disc list-inside space-y-1.5 my-3 font-mono text-xs sm:text-sm pl-2">');
                        inList = true;
                        listType = 'ul';
                    }
                    let itemText = formatInline(ulMatch[1]);
                    htmlParts.push(`<li class="leading-relaxed font-bold text-neutral-800">${itemText}</li>`);
                    continue;
                }

                // 4. Ordered list: 1. item
                const olMatch = trimmed.match(/^(\d+)\.\s+(.*)$/);
                if (olMatch) {
                    if (!inList || listType !== 'ol') {
                        if (inList) htmlParts.push(`</${listType}>`);
                        htmlParts.push('<ol class="list-decimal list-inside space-y-1.5 my-3 font-mono text-xs sm:text-sm pl-2 font-bold">');
                        inList = true;
                        listType = 'ol';
                    }
                    let itemText = formatInline(olMatch[2]);
                    htmlParts.push(`<li class="leading-relaxed font-bold text-neutral-800">${itemText}</li>`);
                    continue;
                }

                if (inList) {
                    htmlParts.push(`</${listType}>`);
                    inList = false;
                }

                // 5. Empty line
                if (!trimmed) {
                    htmlParts.push('<div class="h-2"></div>');
                    continue;
                }

                // 6. Blockquote: > text
                if (trimmed.startsWith('>')) {
                    const qText = formatInline(trimmed.replace(/^>\s*/, ''));
                    htmlParts.push(`
                        <blockquote class="border-l-4 border-[#FF5722] bg-[#F4F0EA] p-3 my-3 font-mono text-xs italic font-bold">
                            ${qText}
                        </blockquote>
                    `);
                    continue;
                }

                // 7. Check for inline image if inside text
                if (trimmed.includes('![') && trimmed.includes('](')) {
                    let replacedLine = trimmed.replace(/!\[(.*?)\]\((.*?)\)/g, (m, alt, src) => {
                        return `<div class="my-4 p-2.5 bg-[#F4F0EA] border-3 border-black shadow-[4px_4px_0px_#000]"><div class="overflow-hidden bg-neutral-950 flex items-center justify-center border-2 border-black max-h-[520px]"><img src="${src}" alt="${alt || 'Иллюстрация'}" class="w-full max-h-[500px] object-contain cursor-pointer" loading="lazy" /></div><div class="mt-2 text-center font-mono text-[11px] font-bold text-neutral-700">▲ ${alt || 'Иллюстрация'}</div></div>`;
                    });
                    htmlParts.push(`<div class="mb-2 leading-relaxed text-neutral-800 font-mono text-xs sm:text-sm">${replacedLine}</div>`);
                    continue;
                }

                // 8. Subheading check (short lines like "Краткая информация", "Формирование коалиции")
                const isSubheading = trimmed.length < 50 && 
                    !/[.,;!?]$/.test(trimmed) && 
                    !trimmed.includes('http') && 
                    !trimmed.startsWith('(') &&
                    !trimmed.includes(':') &&
                    !trimmed.startsWith('<');

                if (isSubheading) {
                    htmlParts.push(`
                        <div class="font-extrabold uppercase text-sm sm:text-base mt-4 mb-1.5 text-black font-mono flex items-center gap-2">
                            <span class="w-2.5 h-2.5 bg-[#CCFF00] border border-black inline-block shrink-0"></span>
                            <span>${formatInline(trimmed)}</span>
                        </div>
                    `);
                    continue;
                }

                // 9. Key: Value or normal paragraph
                let pText = formatInline(trimmed);
                const colonIdx = pText.indexOf(':');
                if (colonIdx > 0 && colonIdx < 40 && !pText.startsWith('<') && !pText.includes('http:')) {
                    const keyPart = pText.substring(0, colonIdx);
                    const valPart = pText.substring(colonIdx + 1);
                    pText = `<strong class="text-black font-extrabold">${keyPart}:</strong><span class="text-neutral-800 font-bold">${valPart}</span>`;
                }

                htmlParts.push(`
                    <p class="mb-2 leading-relaxed text-neutral-800 font-mono text-xs sm:text-sm">
                        ${pText}
                    </p>
                `);
            }

            if (inList) {
                htmlParts.push(`</${listType}>`);
            }

            return htmlParts.join('\n');
        }

                    {wikiModalImg && (
