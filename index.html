        };

        const AdminModal = ({
            isOpen,
            onClose,
            isAdmin,
            setIsAdmin,
            adminPass,
            setAdminPass,
            lastFmApiKey,
            setLastFmApiKey,
            lastFmUser,
            setLastFmUser,
            discordStatus,
            setDiscordStatus,
            discordText,
            setDiscordText,
            discordId,
            setDiscordId,
            onSaveSettingsToDb,
            notify
        }) => {
            const [inputPass, setInputPass] = useState('');
            const [newPass, setNewPass] = useState('');
            const [keyDraft, setKeyDraft] = useState(lastFmApiKey || '');
            const [userDraft, setUserDraft] = useState(lastFmUser || '');
            const [statusDraft, setStatusDraft] = useState(discordStatus || 'online');
            const [textDraft, setTextDraft] = useState(discordText || '');
            const [idDraft, setIdDraft] = useState(discordId || '');

            useEffect(() => {
                if (isOpen) {
                    setInputPass('');
                    setKeyDraft(lastFmApiKey || '');
                    setUserDraft(lastFmUser || 'pruushkaa');
                    setStatusDraft(discordStatus || 'online');
                    setTextDraft(discordText || '');
                    setIdDraft(discordId || '');
                }
            }, [isOpen, lastFmApiKey, lastFmUser, discordStatus, discordText, discordId]);

            if (!isOpen) return null;

            const handleLogin = async (e) => {
                e.preventDefault();
                const cleanInput = inputPass.trim();
                if (cleanInput === adminPass.trim() || (!adminPass && cleanInput === 'admin')) {
                    sfx.playSuccess();
                    triggerGlitchSpike(1.8);
                    setIsAdmin(true);
                    sessionStorage.setItem('pruushkaa_admin_session', 'true');
                    notify("ДОСТУП РАЗРЕШЕН: РЕЖИМ ВЛАДЕЛЬЦА АКТИВИРОВАН!");
                    return;
                }
                // Проверяем актуальный пароль на сервере
                try {
                    const res = await fetch(`/api/data?t=${Date.now()}`);
                    if (res.ok) {
                        const srv = await res.json();
                        const srvPass = (srv.adminPass || 'admin').trim();
                        if (cleanInput === srvPass) {
                            setAdminPass(srvPass);
                            try { localStorage.setItem('pruushkaa_admin_pass', srvPass); } catch (e) {}
                            sfx.playSuccess();
                            triggerGlitchSpike(1.8);
                            setIsAdmin(true);
                            sessionStorage.setItem('pruushkaa_admin_session', 'true');
                            notify("ДОСТУП РАЗРЕШЕН: РЕЖИМ ВЛАДЕЛЬЦА АКТИВИРОВАН!");
                            return;
                        }
                    }
                } catch (err) {}
                sfx.playClick();
                triggerGlitchSpike(2.5);
                notify("ОШИБКА: НЕВЕРНЫЙ ПАРОЛЬ АДМИНИСТРАТОРА!", "warn");
            };

            const handleSaveSettings = (e) => {
                e.preventDefault();
                const trimmedKey = keyDraft.trim();
                const trimmedUser = userDraft.trim() || 'pruushkaa';
                const trimmedText = textDraft.trim() || 'В сети';
                const trimmedId = idDraft.trim();
                const prevPass = adminPass;
                const finalPass = newPass.trim() ? newPass.trim() : adminPass;

                setLastFmApiKey(trimmedKey);
                setLastFmUser(trimmedUser);
                setDiscordStatus(statusDraft);
                setDiscordText(trimmedText);
                setDiscordId(trimmedId);
                if (newPass.trim()) {
                    setAdminPass(finalPass);
                }

                try {
                    if (trimmedKey) {
                        localStorage.setItem('pruushkaa_lastfm_key', trimmedKey);
                    }
                    if (trimmedUser) {
                        localStorage.setItem('pruushkaa_lastfm_user', trimmedUser);
                    }
                    if (trimmedId) {
                        localStorage.setItem('pruushkaa_discord_id', trimmedId);
                    }
                    if (newPass.trim()) {
                        localStorage.setItem('pruushkaa_admin_pass', finalPass);
                        setNewPass('');
                    }
                } catch (err) {}

                if (onSaveSettingsToDb) {
                    onSaveSettingsToDb({
                        authPass: prevPass,
                        adminPass: finalPass,
                        lastFmApiKey: trimmedKey,
                        lastFmUser: trimmedUser,
                        discord: {
                            status: statusDraft,
                            text: trimmedText,
                            discordId: trimmedId,
                            id: trimmedId
                        }
                    });
                }

                sfx.playSuccess();
                triggerGlitchSpike(1.2);
                notify("СИНХРОНИЗАЦИЯ С СЕРВЕРОМ...");
                onClose();
            };

            return (
                <div
                    className="fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4 font-mono overflow-y-auto"
                    onClick={onClose}
                >
                    <div
                        className="bg-white text-black border-4 border-black shadow-[10px_10px_0px_#CCFF00] max-w-md w-full p-5 my-8"
                        onClick={(e) => e.stopPropagation()}
                    >
                        <div className="flex items-center justify-between border-b-2 border-black pb-3 mb-4">
                            <div className="flex items-center gap-2">
                                <span className={`px-2 py-0.5 text-xs font-extrabold border-2 border-black ${
                                    isAdmin ? 'bg-[#CCFF00] text-black' : 'bg-[#FF5722] text-white'
                                }`}>
                                    {isAdmin ? 'ROOT // UNLOCKED' : 'AUTH // REQUIRED'}
                                </span>
                                <span className="font-extrabold text-sm uppercase">
                                    ТЕРМИНАЛ ВЛАДЕЛЬЦА
                                </span>
                            </div>
                            <button
                                onClick={onClose}
                                className="brutal-btn bg-black text-white px-2.5 py-0.5 text-xs font-extrabold"
                            >
                                [X]
                            </button>
                        </div>

                        {!isAdmin ? (
                            <form onSubmit={handleLogin} className="space-y-4 text-xs">
                                <div className="p-3 bg-[#F4F0EA] border-2 border-black font-bold leading-relaxed">
                                    Добавление фотографий, редактирование Вики СРП и смена статуса/ключей защищены паролем владельца.
                                </div>
                                <div>
                                    <label className="font-extrabold block mb-1 uppercase">
                                        ВВЕДИ ПАРОЛЬ АДМИНИСТРАТОРА:
                                    </label>
                                    <input
                                        type="password"
                                        value={inputPass}
                                        onChange={(e) => setInputPass(e.target.value)}
                                        placeholder="Пароль (по умолчанию: admin)"
                                        autoFocus
                                        className="w-full p-2.5 border-3 border-black bg-[#F4F0EA] font-extrabold text-sm focus:outline-none"
                                    />
                                </div>
                                <button
                                    type="submit"
                                    className="brutal-btn w-full py-2.5 bg-[#FF5722] text-white font-extrabold uppercase text-xs"
                                >
                                    <i className="fa-solid fa-unlock-keyhole mr-1.5"></i> РАЗБЛОКИРОВАТЬ РЕДАКТОР И API
                                </button>
                            </form>
                        ) : (
                            <form onSubmit={handleSaveSettings} className="space-y-3 text-xs">
                                <div className="p-2.5 bg-[#CCFF00] border-2 border-black font-extrabold">
                                    ✓ ТЫ АВТОРИЗОВАН КАК ВЛАДЕЛЕЦ. ИЗМЕНЕНИЯ СОХРАНЯТСЯ В БД.
                                </div>

                                <div className="p-3 bg-[#F4F0EA] border-2 border-black space-y-2.5">
                                    <div className="font-extrabold uppercase border-b border-black pb-1 text-[#7C4DFF]">
                                        СТАТУС В DISCORD
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                        <div>
                                            <label className="font-bold block mb-1">РЕЖИМ АКТИВНОСТИ:</label>
                                            <select
                                                value={statusDraft}
                                                onChange={(e) => setStatusDraft(e.target.value)}
                                                className="w-full p-2 border-2 border-black bg-white font-bold focus:outline-none"
                                            >
                                                <option value="online">🟢 В СЕТИ (ONLINE)</option>
                                                <option value="idle">🌙 ОТОШЕЛ (IDLE)</option>
                                                <option value="dnd">⛔ НЕ БЕСПОКОИТЬ (DND)</option>
                                                <option value="offline">⚪ НЕ В СЕТИ (OFFLINE)</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="font-bold block mb-1">DISCORD ID (LANYARD):</label>
                                            <input
                                                type="text"
                                                value={idDraft}
                                                onChange={(e) => setIdDraft(e.target.value)}
                                                placeholder="Напр: 298347298347..."
                                                className="w-full p-2 border-2 border-black bg-white font-bold focus:outline-none"
                                            />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="font-bold block mb-1">ТЕКСТ СТАТУСА В DISCORD:</label>
                                        <input
                                            type="text"
                                            value={textDraft}
                                            onChange={(e) => setTextDraft(e.target.value)}
                                            placeholder="В сети"
                                            className="w-full p-2 border-2 border-black bg-white font-bold focus:outline-none"
                                        />
                                    </div>
                                </div>

                                <div className="p-3 bg-[#F4F0EA] border-2 border-black space-y-2.5">
                                    <div className="font-extrabold uppercase border-b border-black pb-1 text-[#FF5722]">
                                        НАСТРОЙКА LAST.FM API
                                    </div>
                                    <div>
                                        <label className="font-bold block mb-1">LAST.FM API KEY (32 символа):</label>
                                        <input
                                            type="text"
                                            value={keyDraft}
                                            onChange={(e) => setKeyDraft(e.target.value)}
                                            placeholder="Вставь сюда свой API ключ Last.fm..."
                                            className="w-full p-2 border-2 border-black bg-white font-bold focus:outline-none"
                                        />
                                    </div>
                                    <div>
                                        <label className="font-bold block mb-1">LAST.FM USERNAME:</label>
                                        <input
                                            type="text"
                                            value={userDraft}
                                            onChange={(e) => setUserDraft(e.target.value)}
                                            placeholder="pruushkaa"
                                            className="w-full p-2 border-2 border-black bg-white font-bold focus:outline-none"
                                        />
                                    </div>
                                </div>

                                <div className="p-3 bg-[#F4F0EA] border-2 border-black space-y-2">
                                    <div className="font-extrabold uppercase border-b border-black pb-1">
                                        СМЕНА ПАРОЛЯ АДМИНИСТРАТОРА
                                    </div>
                                    <input
                                        type="password"
                                        value={newPass}
                                        onChange={(e) => setNewPass(e.target.value)}
                                        placeholder="Новый пароль (оставь пустым, чтобы не менять)"
                                        className="w-full p-2 border-2 border-black bg-white font-bold focus:outline-none"
                                    />
                                </div>

                                <div className="flex flex-wrap gap-2 pt-1">
                                    <button
                                        type="submit"
                                        className="brutal-btn flex-1 py-2.5 bg-[#FF5722] text-white font-extrabold uppercase"
                                    >
                                        <i className="fa-solid fa-floppy-disk mr-1.5"></i> СОХРАНИТЬ И СИНХРОНИЗИРОВАТЬ
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => {
                                            sfx.playClick();
                                            setIsAdmin(false);
                                            sessionStorage.removeItem('pruushkaa_admin_session');
                                            notify("РЕЖИМ АДМИНИСТРАТОРА ЗАБЛОКИРОВАН");
                                            onClose();
                                        }}
                                        className="brutal-btn px-3 py-2.5 bg-black text-white font-bold uppercase"
                                    >
                                        ВЫЙТИ [🔒]
                                    </button>
                                </div>
                            </form>
                        )}
                    </div>
                </div>
            );
        };

        /* ==========================================================================
           INDEXEDDB PERMANENT STORAGE ENGINE (UNLIMITED STORAGE FOR BIG GPX TRACKS)
           ========================================================================== */
        const IDB_DB_NAME = 'pruushkaa_permanent_storage';
        const IDB_STORE_NAME = 'tracks_store';

        const openIDB = () => new Promise((resolve) => {
            try {
                if (typeof indexedDB === 'undefined') return resolve(null);
                const req = indexedDB.open(IDB_DB_NAME, 1);
                req.onupgradeneeded = () => {
                    req.result.createObjectStore(IDB_STORE_NAME);
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => resolve(null);
            } catch (e) {
                resolve(null);
            }
        });

        const saveToIDB = async (key, val) => {
            try {
                const db = await openIDB();
                if (!db) return false;
                return new Promise((resolve) => {
                    const tx = db.transaction(IDB_STORE_NAME, 'readwrite');
                    const store = tx.objectStore(IDB_STORE_NAME);
                    store.put(val, key);
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = () => resolve(false);
                });
            } catch (e) {
                return false;
            }
        };

        const loadFromIDB = async (key) => {
            try {
                const db = await openIDB();
                if (!db) return null;
                return new Promise((resolve) => {
                    const tx = db.transaction(IDB_STORE_NAME, 'readonly');
                    const store = tx.objectStore(IDB_STORE_NAME);
                    const req = store.get(key);
                    req.onsuccess = () => resolve(req.result || null);
                    req.onerror = () => resolve(null);
                });
            } catch (e) {
                return null;
            }
        };

        const persistAllTracks = async (trackList) => {
            if (!Array.isArray(trackList)) return;
            // 1. IndexedDB - handles unlimited gigabytes of GPX XML without QuotaExceededError
            await saveToIDB('pruushkaa_tracks_v3', trackList);
            // 2. LocalStorage backup (safely handled if quota is reached)
            try {
                localStorage.setItem('pruushkaa_tracks_user_modified', 'true');
                localStorage.setItem('pruushkaa_tracks_v2', JSON.stringify(trackList));
            } catch (quotaErr) {
                console.info('LocalStorage quota reached, saved safely to IndexedDB');
            }
        };

        /* ==========================================================================
           GPX ROUTE ARCHIVE & INTERACTIVE MAP MODULE (LEAFLET + LEAFLET-GPX)
           ========================================================================== */
        const GpxRouteArchive = ({ tracks, setTracks, notify, syncDatabase, isAdmin, onOpenAdmin, darkMode }) => {
            const [localTracks, setLocalTracks] = useState([]);
            const [selectedTrackId, setSelectedTrackId] = useState(null);
            const [selectedCategory, setSelectedCategory] = useState('ВСЕ');
            const [searchQuery, setSearchQuery] = useState('');
            const [isDraggingOver, setIsDraggingOver] = useState(false);
            const [isLoadingTrack, setIsLoadingTrack] = useState(false);
            const [mapError, setMapError] = useState(null);
            const [showStatsModal, setShowStatsModal] = useState(false);
            const [tileMode, setTileMode] = useState('auto'); // 'auto', 'dark', 'light'

            // Admin creation form state
            const [isAdding, setIsAdding] = useState(false);
            const [formTitle, setFormTitle] = useState('');
            const [formDate, setFormDate] = useState('');
            const [formTags, setFormTags] = useState('gravel, off-road');
            const [formDesc, setFormDesc] = useState('');
            const [formGpxRaw, setFormGpxRaw] = useState('');
            const [formTelemetry, setFormTelemetry] = useState(null);

            // Active track live telemetry calculated by L.GPX
            const [activeTelemetry, setActiveTelemetry] = useState(null);

            const mapContainerRef = useRef(null);
            const mapInstanceRef = useRef(null);
            const tileLayerRef = useRef(null);
            const gpxLayerRef = useRef(null);
            const markersLayerRef = useRef(null);
            const fileInputRef = useRef(null);
            const adminFileInputRef = useRef(null);

            // Calculate telemetry helper for raw XML
            const calculateGpxTelemetry = (xml) => {
                const trkptRegex = /<trkpt\s+lat="([^"]+)"\s+lon="([^"]+)"[^>]*>([\s\S]*?)<\/trkpt>/gi;
                let match;
                const points = [];
                while ((match = trkptRegex.exec(xml)) !== null) {
                    const lat = parseFloat(match[1]);
                    const lon = parseFloat(match[2]);
                    const inner = match[3];
                    const eleMatch = inner.match(/<ele>([^<]+)<\/ele>/i);
                    const timeMatch = inner.match(/<time>([^<]+)<\/time>/i);
                    const ele = eleMatch ? parseFloat(eleMatch[1]) : null;
                    const time = timeMatch ? new Date(timeMatch[1]).getTime() : null;
                    if (!isNaN(lat) && !isNaN(lon)) points.push({ lat, lon, ele, time });
                }
                if (points.length < 2) return null;
                let totalDist = 0;
                let elevationGain = 0;
                const toRad = x => (x * Math.PI) / 180;
                for (let i = 1; i < points.length; i++) {
                    const p1 = points[i - 1];
                    const p2 = points[i];
                    const dLat = toRad(p2.lat - p1.lat);
                    const dLon = toRad(p2.lon - p1.lon);
                    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(toRad(p1.lat)) * Math.cos(toRad(p2.lat)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
                    totalDist += 6371000 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                    if (p1.ele !== null && p2.ele !== null && p2.ele > p1.ele) elevationGain += (p2.ele - p1.ele);
                }
                let movingTimeStr = '--';
                if (points[0].time && points[points.length - 1].time) {
                    const totalSec = Math.round((points[points.length - 1].time - points[0].time) / 1000);
                    const h = Math.floor(totalSec / 3600);
                    const m = Math.floor((totalSec % 3600) / 60);
                    movingTimeStr = h > 0 ? `${h}ч ${m}м` : `${m}м`;
                }
                return {
                    distanceKm: parseFloat((totalDist / 1000).toFixed(1)),
                    elevationGainM: Math.round(elevationGain),
                    movingTime: movingTimeStr
                };
            };

            // Combine local (dragged/uploaded) tracks with database manifest
            const allTracks = useMemo(() => {
                return [...localTracks, ...(tracks || [])];
            }, [localTracks, tracks]);

            // Set initial selected track
            useEffect(() => {
                if (!selectedTrackId && allTracks.length > 0) {
                    setSelectedTrackId(allTracks[0].id);
                }
            }, [allTracks, selectedTrackId]);

            const currentTrack = useMemo(() => {
                return allTracks.find(t => t.id === selectedTrackId) || allTracks[0] || null;
            }, [allTracks, selectedTrackId]);

            // Unique categories from tags
            const categories = useMemo(() => {
                const set = new Set(['ВСЕ']);
                if (localTracks.length > 0) set.add('local');
                allTracks.forEach(t => {
                    if (Array.isArray(t.tags)) {
                        t.tags.forEach(tag => set.add(tag));
                    }
                });
                return Array.from(set);
            }, [allTracks, localTracks]);

            // Filtered tracks
            const filteredTracks = useMemo(() => {
                return allTracks.filter(t => {
                    const matchesCategory = selectedCategory === 'ВСЕ' ||
                        (Array.isArray(t.tags) && t.tags.includes(selectedCategory)) ||
                        (selectedCategory === 'local' && t.isLocal);
                    const q = searchQuery.toLowerCase().trim();
                    const matchesQuery = !q ||
                        (t.title && t.title.toLowerCase().includes(q)) ||
                        (t.description && t.description.toLowerCase().includes(q)) ||
                        (Array.isArray(t.tags) && t.tags.some(tag => tag.toLowerCase().includes(q)));
                    return matchesCategory && matchesQuery;
                });
            }, [allTracks, selectedCategory, searchQuery]);

            // Tile configuration: 100% free, no API keys, zero watermarks
            const isDarkTiles = useMemo(() => {
                if (tileMode === 'dark') return true;
                if (tileMode === 'light') return false;
                if (tileMode === 'satellite') return false;
                return true; // Default to dark brutalist aesthetic
            }, [tileMode]);

            const currentTileConfig = useMemo(() => {
                if (tileMode === 'satellite') {
                    return {
                        url: 'https://services.arcgisonline.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
                        className: 'tiles-sat',
                        maxZoom: 18,
                        subdomains: '',
                        attribution: '&copy; <a href="https://www.esri.com/">Esri</a>'
                    };
                }
                return {
                    url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
                    className: isDarkTiles ? 'tiles-dark' : 'tiles-light',
                    maxZoom: 19,
                    subdomains: '',
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
                };
            }, [tileMode, isDarkTiles]);

            // 1. Initialize Map
            useEffect(() => {
                if (!mapContainerRef.current || mapInstanceRef.current) return;

                if (typeof L === 'undefined') {
                    console.error('Leaflet is not loaded');
                    return;
                }

                const map = L.map(mapContainerRef.current, {
                    zoomControl: false,
                    attributionControl: true
                }).setView([55.751244, 37.618423], 11);

                L.control.zoom({ position: 'topright' }).addTo(map);

                const tiles = L.tileLayer(currentTileConfig.url, {
                    maxZoom: currentTileConfig.maxZoom,
                    className: currentTileConfig.className,
                    attribution: currentTileConfig.attribution
                }).addTo(map);

                const markers = L.layerGroup().addTo(map);

                mapInstanceRef.current = map;
                tileLayerRef.current = tiles;
                markersLayerRef.current = markers;

                setTimeout(() => {
                    map.invalidateSize();
                }, 250);

                return () => {
                    map.remove();
                    mapInstanceRef.current = null;
                };
            }, []);

            // 2. Dynamic Tile Switch on Theme or Mode change
            useEffect(() => {
                if (!mapInstanceRef.current || !tileLayerRef.current) return;
                mapInstanceRef.current.removeLayer(tileLayerRef.current);
                const newTiles = L.tileLayer(currentTileConfig.url, {
                    maxZoom: currentTileConfig.maxZoom,
                    className: currentTileConfig.className,
                    attribution: currentTileConfig.attribution
                }).addTo(mapInstanceRef.current);
                if (typeof newTiles.bringToBack === 'function') {
                    newTiles.bringToBack();
                }
                tileLayerRef.current = newTiles;
            }, [currentTileConfig]);

            // 3. Render GPX Track Layer & Custom SVG Markers
            const renderTrack = useCallback((track) => {
                if (!track || !mapInstanceRef.current) return;
                if (typeof L === 'undefined' || typeof L.GPX === 'undefined') {
                    setMapError('Библиотека leaflet-gpx не загружена.');
                    return;
                }

                setIsLoadingTrack(true);
                setMapError(null);

                const map = mapInstanceRef.current;

                // Remove previous track & markers from memory
                if (gpxLayerRef.current) {
                    map.removeLayer(gpxLayerRef.current);
                    gpxLayerRef.current = null;
                }
                if (markersLayerRef.current) {
                    markersLayerRef.current.clearLayers();
                }

                const trackSource = track.rawGpx || track.file;
                if (!trackSource) {
                    setIsLoadingTrack(false);
                    setMapError('Файл трека отсутствует.');
                    return;
                }

                // Strictly use site primary accent color #FF5722
                const accentColor = '#FF5722';

                try {
                    const gpx = new L.GPX(trackSource, {
                        async: true,
                        marker_options: {
                            startIconUrl: null,
                            endIconUrl: null,
                            shadowUrl: null,
                            wptIconUrls: { '': null }
                        },
                        polyline_options: {
                            color: accentColor,
                            opacity: 0.95,
                            weight: 3.5,
                            lineCap: 'round',
                            lineJoin: 'round'
                        }
                    });

                    gpx.on('loaded', (e) => {
                        const g = e.target;
                        if (!mapInstanceRef.current) return;

                        // Fly smoothly to track bounds
                        const bounds = g.getBounds();
                        if (bounds && bounds.isValid()) {
                            mapInstanceRef.current.flyToBounds(bounds, {
                                padding: [45, 45],
                                duration: 1.1,
                                easeLinearity: 0.25
                            });
                        }

                        // Extract start & finish points for custom minimalist SVG markers
                        let startPoint = null;
                        let endPoint = null;
                        let minEle = 99999;
                        let maxEle = -99999;
                        let totalPoints = 0;

                        const layers = g.getLayers();
                        for (const l of layers) {
                            if (typeof l.getLatLngs === 'function') {
                                const latlngs = l.getLatLngs();
                                const flat = Array.isArray(latlngs[0]) ? latlngs.flat(Infinity) : latlngs;
                                if (flat.length > 0) {
                                    startPoint = flat[0];
                                    endPoint = flat[flat.length - 1];
                                    totalPoints += flat.length;
                                    for (const p of flat) {
                                        if (p.meta && typeof p.meta.ele === 'number') {
                                            if (p.meta.ele < minEle) minEle = p.meta.ele;
                                            if (p.meta.ele > maxEle) maxEle = p.meta.ele;
                                        }
                                    }
                                }
                            }
                        }

                        // Add custom Start SVG Marker (Lime pulse)
                        if (markersLayerRef.current && startPoint) {
                            const startIcon = L.divIcon({
                                className: 'gpx-pin-start',
                                iconSize: [28, 28],
                                iconAnchor: [14, 14],
                                html: `<div style="position:relative;width:28px;height:28px;display:flex;align-items:center;justify-content:center;">
                                    <div style="position:absolute;inset:0;border-radius:50%;background:#CCFF00;opacity:0.35;animation:ping 1.5s cubic-bezier(0,0,0.2,1) infinite;"></div>
                                    <div style="width:20px;height:20px;background:#CCFF00;border:2.5px solid #000;box-shadow:2px 2px 0 #000;display:flex;align-items:center;justify-content:center;color:#000;font-size:10px;font-weight:900;font-family:'Space Grotesk',sans-serif;">
                                        S
                                    </div>
                                </div>`
                            });
                            const m1 = L.marker(startPoint, { icon: startIcon }).bindTooltip(`СТАРТ: ${track.title}`, { direction: 'top', offset: [0, -10], className: 'brutal-tooltip' });
                            markersLayerRef.current.addLayer(m1);
                        }

                        // Add custom Finish SVG Marker (Accent orange)
                        if (markersLayerRef.current && endPoint) {
                            const endIcon = L.divIcon({
                                className: 'gpx-pin-end',
                                iconSize: [28, 28],
                                iconAnchor: [14, 14],
                                html: `<div style="position:relative;width:28px;height:28px;display:flex;align-items:center;justify-content:center;">
                                    <div style="width:20px;height:20px;background:#FF5722;border:2.5px solid #000;box-shadow:2px 2px 0 #000;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:900;font-family:'Space Grotesk',sans-serif;">
                                        F
                                    </div>
                                </div>`
                            });
                            const m2 = L.marker(endPoint, { icon: endIcon }).bindTooltip(`ФИНИШ: ${track.title}`, { direction: 'top', offset: [0, -10], className: 'brutal-tooltip' });
                            markersLayerRef.current.addLayer(m2);
                        }

                        // Calculate and update telemetry
                        const distM = typeof g.get_distance === 'function' ? g.get_distance() : 0;
                        const gainM = typeof g.get_elevation_gain === 'function' ? g.get_elevation_gain() : 0;
                        const lossM = typeof g.get_elevation_loss === 'function' ? g.get_elevation_loss() : 0;
                        const moveMs = typeof g.get_moving_time === 'function' && g.get_moving_time() > 0 ? g.get_moving_time() : (typeof g.get_total_time === 'function' ? g.get_total_time() : 0);
                        const speedKmh = typeof g.get_moving_speed === 'function' && g.get_moving_speed() > 0
                            ? g.get_moving_speed() * 3.6
                            : (distM > 0 && moveMs > 0 ? ((distM / 1000) / (moveMs / 3600000)) : 0);

                        const totalSec = Math.round(moveMs / 1000);
                        const h = Math.floor(totalSec / 3600);
                        const m = Math.floor((totalSec % 3600) / 60);
                        const s = totalSec % 60;
                        const formattedTime = h > 0 ? `${h}ч ${m}м` : (m > 0 ? `${m}м ${s}с` : `${s}с`);

                        const telemetry = {
                            distanceKm: (distM / 1000).toFixed(1),
                            elevationGainM: Math.round(gainM),
                            elevationLossM: Math.round(lossM),
                            movingTime: formattedTime,
                            avgSpeed: speedKmh > 0 ? speedKmh.toFixed(1) : null,
                            pointsCount: totalPoints,
                            minEle: minEle < 90000 ? Math.round(minEle) : null,
                            maxEle: maxEle > -90000 ? Math.round(maxEle) : null
                        };

                        setActiveTelemetry(telemetry);
                        setIsLoadingTrack(false);
                    });

                    gpx.on('error', (err) => {
                        console.error('GPX load error:', err);
                        setMapError(`Не удалось загрузить .gpx файл [${track.title}]. Проверьте файл.`);
                        setIsLoadingTrack(false);
                        notify('ОШИБКА ЗАГРУЗКИ GPX ФАЙЛА', 'warn');
                    });

                    gpx.addTo(map);
                    gpxLayerRef.current = gpx;

                } catch (e) {
                    console.error('GPX init exception:', e);
                    setMapError(e.message);
                    setIsLoadingTrack(false);
                }
            }, [notify]);

            // Re-render when selected track changes
            useEffect(() => {
                if (currentTrack && mapInstanceRef.current) {
                    renderTrack(currentTrack);
                }
            }, [currentTrack, renderTrack]);

            // File Drag & Drop & Upload logic - Multi-file and persistent storage!
            const handleMultipleGpxFiles = async (files) => {
                if (!files || files.length === 0) return;
                const fileList = Array.isArray(files) ? files : Array.from(files);
                const gpxList = fileList.filter(f => f.name && f.name.toLowerCase().endsWith('.gpx'));
                if (gpxList.length === 0) {
                    notify('ТРЕБУЮТСЯ ФАЙЛЫ В ФОРМАТЕ .GPX', 'warn');
                    return;
                }

                setIsLoadingTrack(true);
                const newTracksList = [];
                for (const file of gpxList) {
                    try {
                        const text = await file.text();
                        const cleanTitle = file.name.replace(/\.gpx$/i, '').replace(/[-_]+/g, ' ').toUpperCase();
                        const today = new Date().toISOString().slice(0, 10);
                        const uniqueId = `ride-${Date.now()}-${Math.random().toString(36).substring(2, 7)}`;
                        const stats = calculateGpxTelemetry(text);

                        newTracksList.push({
                            id: uniqueId,
                            title: cleanTitle,
                            date: today,
                            file: null,
                            rawGpx: text,
                            description: `Загружен из файла [${file.name}], размер: ${(file.size / 1024).toFixed(1)} КБ`,
                            tags: ['custom', 'gpx'],
                            telemetry: stats,
                            isCustom: true
                        });
                    } catch (err) {
                        console.error('Ошибка чтения GPX:', file.name, err);
                    }
                }

                if (newTracksList.length === 0) {
                    setIsLoadingTrack(false);
                    return;
                }

                const updated = [...newTracksList, ...(tracks || [])];
                setTracks(updated);
                await persistAllTracks(updated);
                syncDatabase(null, null, null, updated);
                setSelectedTrackId(newTracksList[0].id);
                setIsLoadingTrack(false);
                sfx.playSuccess();
                triggerGlitchSpike(1.2);
                notify(`СОХРАНЕНО МАРШРУТОВ: ${newTracksList.length} (ОСТАНУТСЯ ПОСЛЕ ПЕРЕЗАГРУЗКИ)!`);
            };

            const handleGpxFile = (file) => {
                if (file) handleMultipleGpxFiles([file]);
            };

            const onDragOver = (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (!isDraggingOver) setIsDraggingOver(true);
            };

            const onDragLeave = (e) => {
                e.preventDefault();
                e.stopPropagation();
                setIsDraggingOver(false);
            };

            const onDrop = (e) => {
                e.preventDefault();
                e.stopPropagation();
                setIsDraggingOver(false);
                const files = Array.from(e.dataTransfer.files || []);
                if (files.length > 0) handleMultipleGpxFiles(files);
            };

            // Download GPX
            const handleDownloadGpx = () => {
                if (!currentTrack) return;
                sfx.playSuccess();
                if (currentTrack.rawGpx) {
                    const blob = new Blob([currentTrack.rawGpx], { type: 'application/gpx+xml' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${currentTrack.id}.gpx`;
                    a.click();
                    URL.revokeObjectURL(url);
                } else if (currentTrack.file) {
                    const a = document.createElement('a');
                    a.href = currentTrack.file;
                    a.download = `${currentTrack.id}.gpx`;
                    a.click();
                }
                notify(`СКАЧИВАНИЕ .GPX [${currentTrack.title}]...`);
            };

            // Recenter
            const handleRecenter = () => {
                if (!gpxLayerRef.current || !mapInstanceRef.current) return;
                sfx.playClick();
                const bounds = gpxLayerRef.current.getBounds();
                if (bounds && bounds.isValid()) {
                    mapInstanceRef.current.flyToBounds(bounds, { padding: [45, 45] });
                }
            };

            // Admin: Process uploaded GPX for permanent database entry
            const handleAdminGpxFile = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const xml = ev.target.result;
                    setFormGpxRaw(xml);
                    const stats = calculateGpxTelemetry(xml);
                    if (stats) setFormTelemetry(stats);
                    if (!formTitle) {
                        const baseName = file.name.replace(/\.gpx$/i, '').replace(/[-_]+/g, ' ').toUpperCase();
                        setFormTitle(baseName);
                    }
                    if (!formDate) {
                        setFormDate(new Date().toISOString().slice(0, 10));
                    }
                    notify("GPX ФАЙЛ СЧИТАН И ТЕЛЕМЕТРИЯ РАССЧИТАНА!");
                };
                reader.readAsText(file);
            };

            // Admin: Save new route into permanent database
            const handleSaveNewRoute = async (e) => {
                e.preventDefault();
                if (!isAdmin) {
                    notify("ДОСТУП ЗАПРЕЩЕН: ТРЕБУЕТСЯ ПАРОЛЬ АДМИНИСТРАТОРА", "warn");
                    onOpenAdmin();
                    return;
                }
                if (!formTitle.trim() || !formGpxRaw.trim()) {

                const updated = [savedTrack, ...tracks];
                setTracks(updated);

                try {
                    localStorage.setItem('pruushkaa_tracks_user_modified', 'true');

                    description: t.description || '',
                    tags: t.tags || [],
                    telemetry: t.telemetry || null

                const a = document.createElement('a');
                a.href = url;
                a.download = 'tracks.json';

                                        id: a.id || `SRP-0${idx + 1}`,
                                        title: a.title || `СТАТЬЯ // ${a.id || idx + 1}`,
                                        category: a.category || (idx === 0 ? 'ОСНОВНОЕ' : 'ИСТОРИЯ / ЛОР'),
                                        updated: a.updated || '2026.02',
                                        author: a.author || 'pruushkaa',
                                        tags: Array.isArray(a.tags) ? a.tags : ['СРП', 'архив'],
                                        content: a.content || ''
                                    }));
                                    const normalizedW = normalizeWiki(serverWiki);
                                    setWikiArticles(normalizedW);
                                    try { localStorage.setItem('pruushkaa_wiki_v2', JSON.stringify(normalizedW)); } catch (e) {}
                                }
                                if (Array.isArray(data.tracks) && data.tracks.length > 0) {
                                    const isUserModified = localStorage.getItem('pruushkaa_tracks_user_modified') === 'true';
                                    if (!isUserModified) {
                                        setTracks(data.tracks);
                                        persistAllTracks(data.tracks);
                                    }
                                }
                                if (data.adminPass) {
                                    setAdminPass(data.adminPass);
                                    try { localStorage.setItem('pruushkaa_admin_pass', data.adminPass); } catch (e) {}
                                }
                                if (data.lastFmApiKey !== undefined && data.lastFmApiKey !== '') {
                                    setLastFmApiKey(data.lastFmApiKey);
                                }
                                if (data.lastFmUser && data.lastFmUser !== '') {
                                    setLastFmUser(data.lastFmUser);
                                }
                                if (data.discord) {
                                    if (data.discord.status) {
                                        setDiscordStatus(data.discord.status);
                                    }
                                    if (data.discord.text) {
                                        setDiscordText(data.discord.text);
                                    }
                                    const dId = data.discord.discordId !== undefined ? data.discord.discordId : data.discord.id;
                                    if (dId !== undefined && dId !== '') {
                                        setDiscordId(dId);
                                    }
                                } else if (data.discordStatus) {
                                    setDiscordText(data.discordStatus);
                                }
                                break;
                            }
                        } catch (err) {}
                    }
                };

                const loadTracksManifest = async () => {
                    const isUserModified = localStorage.getItem('pruushkaa_tracks_user_modified') === 'true';
                    if (isUserModified) return;
                    const endpoints = ['./tracks.json', 'tracks.json', './public/tracks.json', '/tracks.json'];
                    for (const url of endpoints) {
                        try {
                            const res = await fetch(`${url}?t=${Date.now()}`);
                            if (!res.ok) continue;
                            const data = await res.json();
                            if (Array.isArray(data) && isMounted) {
                                if (localStorage.getItem('pruushkaa_tracks_user_modified') !== 'true') {
                                    setTracks(data);
                                }
                                break;
                            }
                        } catch (_) {}
                    }
                };

                loadServerDatabase();
                loadTracksManifest();
                const syncInterval = setInterval(() => {
                    loadServerDatabase();
                }, 15000);
                return () => {
                    isMounted = false;
                    clearInterval(syncInterval);
                };
            }, []);

            const syncDatabase = useCallback(async (nextPhotos, nextWiki, customPayload, nextTracks) => {
                if (!isAdmin) {
                    notify("ДЛЯ СИНХРОНИЗАЦИИ ТРЕБУЮТСЯ ПРАВА АДМИНИСТРАТОРА", "warn");
                    return;
                }
                const pToSave = (nextPhotos !== null && nextPhotos !== undefined) ? nextPhotos : photos;
                const wToSave = (nextWiki !== null && nextWiki !== undefined) ? nextWiki : wikiArticles;
                const tToSave = (nextTracks !== null && nextTracks !== undefined) ? nextTracks : tracks;
                const discObj = customPayload?.discord || {
                    status: discordStatus,
                    text: discordText,
                    discordId: discordId,
                    id: discordId
                };
                const authPassToSend = customPayload?.authPass || adminPass;
                const passToSave = customPayload?.adminPass || adminPass;
                const keyToSave = customPayload?.lastFmApiKey !== undefined ? customPayload.lastFmApiKey : lastFmApiKey;
                const userToSave = customPayload?.lastFmUser || lastFmUser;

                try {
                    localStorage.setItem('pruushkaa_photos_v2', JSON.stringify(pToSave));
                    localStorage.setItem('pruushkaa_wiki_v2', JSON.stringify(wToSave));
                    persistAllTracks(tToSave);
                    localStorage.setItem('pruushkaa_admin_pass', passToSave);
                    if (keyToSave && keyToSave !== 'ВАШ_LASTFM_API_KEY') {
                        localStorage.setItem('pruushkaa_lastfm_key', keyToSave);
                    }
                    if (userToSave) {
                        localStorage.setItem('pruushkaa_lastfm_user', userToSave);
                    }
                } catch (e) {}

                if (window.location.protocol === 'file:') {
                    notify("ВНИМАНИЕ: ОТКРЫТ ЛОКАЛЬНЫЙ ФАЙЛ (FILE://). СОХРАНЕНО В БРАУЗЕРЕ.", "info");
                    return;
                }

                try {
                    const res = await fetch(`/api/data?t=${Date.now()}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'x-admin-password': authPassToSend
                        },
                        body: JSON.stringify({
                            authPass: authPassToSend,
                            password: authPassToSend,
                            adminPass: passToSave,
                            lastFmApiKey: keyToSave,
                            lastFmUser: userToSave,
                            photos: pToSave,
                            wiki: wToSave,
                            articles: wToSave,
                            tracks: tToSave,
                            discord: discObj,
                            discordStatus: discObj.text
                        })
                    });

                    if (res.ok) {
                        notify("СОХРАНЕНО В DATABASE.JSON НА СЕРВЕРЕ (ДЛЯ ВСЕХ УСТРОЙСТВ)!");
                    } else {
                        const errData = await res.json().catch(() => ({}));
                        if (res.status === 404 || res.status === 405) {
                            notify("СОХРАНЕНО В БРАУЗЕРЕ (LOCALSTORAGE). ДЛЯ ВСЕХ: СКАЧАЙТЕ TRACKS.JSON И СДЕЛАЙТЕ GIT PUSH", "info");
                        } else {
                            notify(`ОШИБКА СЕРВЕРА (${res.status}): ${errData.error || 'ПРОВЕРЬТЕ СЕРВЕР'}`, "warn");
                        }
                    }
                } catch (e) {
                    if (window.location.hostname.includes('github.io') || !window.location.port) {
                        notify("СОХРАНЕНО В БРАУЗЕРЕ (ДЛЯ ПУБЛИКАЦИИ ВСЕМ: СКАЧАЙТЕ TRACKS.JSON И СДЕЛАЙТЕ GIT PUSH)", "info");
                    } else {
                        notify("СОХРАНЕНО В БРАУЗЕРЕ (ЛОКАЛЬНЫЙ БЭКЕНД НЕ ЗАПУЩЕН)", "info");
                    }
                }

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                console.error("ErrorBoundary caught:", error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div style={{ padding: '24px', fontFamily: 'monospace', background: '#F4F0EA', minHeight: '100vh', color: '#000', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                            <div style={{ maxWidth: '600px', border: '4px solid #000', padding: '24px', background: '#fff', boxShadow: '8px 8px 0px #000' }}>
                                <div style={{ background: '#FF5722', color: '#fff', padding: '6px 12px', fontWeight: '900', display: 'inline-block', marginBottom: '12px' }}>
                                    SYS_ERROR // ОШИБКА ИНТЕРФЕЙСА
                                </div>
                                <h2 style={{ fontSize: '18px', fontWeight: '900', marginBottom: '8px' }}>ПРОИЗОШЕЛ СБОЙ В КОМПОНЕНТЕ</h2>
                                <p style={{ fontSize: '12px', color: '#555', marginBottom: '16px' }}>{this.state.error?.message || 'Неизвестная ошибка рендеринга'}</p>
                                <button
                                    onClick={() => window.location.reload()}
                                    style={{ background: '#CCFF00', color: '#000', border: '3px solid #000', padding: '8px 16px', fontWeight: '900', cursor: 'pointer', boxShadow: '3px 3px 0px #000' }}
                                >
                                    ПЕРЕЗАГРУЗИТЬ СТРАНИЦУ
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
