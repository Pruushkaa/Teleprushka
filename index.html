        const INITIAL_TRACKS = [
            {
                id: "ride-2026-08-route3-night-city",
                title: "Ночной урбан-заезд",
                date: "2026-08-09",
                file: "tracks/route3-night-city.gpx",
                description: "Пустые ночные проспекты, мосты и кольцевые развязки",
                tags: ["urban", "night"],
                telemetry: { distanceKm: 15.7, elevationGainM: 126, movingTime: "1ч 10м" }
            },
            {
                id: "ride-2026-07-route2-river",
                title: "Набережная и дамба",
                date: "2026-07-22",
                file: "tracks/route2-river.gpx",
                description: "Скоростной асфальтовый заезд вдоль реки и набережных",
                tags: ["scenic", "speed", "asphalt"],
                telemetry: { distanceKm: 14.9, elevationGainM: 24, movingTime: "1ч 8м" }
            },
            {
                id: "ride-2026-06-route1-forest",
                title: "Лесной маршрут",
                date: "2026-06-15",
                file: "tracks/route1-forest.gpx",
                description: "Грунты, лесные тропы и полевые участки вдоль бора",
                tags: ["forest", "gravel"],
                telemetry: { distanceKm: 15.7, elevationGainM: 175, movingTime: "1ч 10м" }
            }
        ];

        const App = () => {
            const [sfxEnabled, setSfxEnabled] = useState(true);
            const [darkMode, setDarkMode] = useState(() => {
                try {
                    const saved = localStorage.getItem('archive_theme');
                    return saved === 'cyber';
                } catch (e) {
                    return false;
                }
            });
            const [toast, setToast] = useState(null);
            const [discordCopied, setDiscordCopied] = useState(false);
            const [cmdOpen, setCmdOpen] = useState(false);
            const [visitorCount, setVisitorCount] = useState(1428);
            const [activeSection, setActiveSection] = useState('HOME');
            const [tracks, setTracks] = useState(INITIAL_TRACKS);

            const [lastFmApiKey, setLastFmApiKey] = useState(() => {
                if (CONFIG.LASTFM_API_KEY && CONFIG.LASTFM_API_KEY !== 'ВАШ_LASTFM_API_KEY') {
                    return CONFIG.LASTFM_API_KEY;
                }
                try {
                    const saved = localStorage.getItem('pruushkaa_lastfm_key');
                    if (saved && saved !== 'ВАШ_LASTFM_API_KEY') return saved;
                } catch (e) {}
                return '';
            });

            const [lastFmUser, setLastFmUser] = useState(() => {
                if (CONFIG.LASTFM_USER && CONFIG.LASTFM_USER !== 'pruushkaa') {
                    return CONFIG.LASTFM_USER;
                }
                try {
                    const saved = localStorage.getItem('pruushkaa_lastfm_user');
                    if (saved) return saved;
                } catch (e) {}
                return CONFIG.LASTFM_USER || 'Pruushkaa';
            });
            const [discordStatus, setDiscordStatus] = useState(CONFIG.DEFAULT_DISCORD_STATUS || 'offline');
            const [discordText, setDiscordText] = useState(CONFIG.DEFAULT_DISCORD_TEXT || 'Автономный режим');
            const [discordId, setDiscordId] = useState(CONFIG.DISCORD_USER_ID || '655742532772429834');

            const [photos, setPhotos] = useState(() => loadStoredList('pruushkaa_photos_v2', normalizePhotos, INITIAL_PHOTOS));

            const [wikiArticles, setWikiArticles] = useState(() => loadStoredList('pruushkaa_wiki_v2', normalizeWiki, INITIAL_WIKI_ARTICLES));

            const discordTag = "pruushkaa";

            const notify = useCallback((msg, type = "info") => {
                setToast({ msg, type });
                setTimeout(() => {
                    setToast((current) => (current?.msg === msg ? null : current));
                }, 3200);
            }, []);

            useEffect(() => {
                let isMounted = true;

                // 1. Асинхронная загрузка из IndexedDB (полная сохранность фото/вики/треков без лимита localStorage)
                loadFromIDB('pruushkaa_photos_v3').then((idbPhotos) => {
                    if (isMounted && Array.isArray(idbPhotos) && idbPhotos.length > 0) {
                        setPhotos(normalizePhotos(idbPhotos));
                    }
                }).catch(() => {});

                loadFromIDB('pruushkaa_wiki_v3').then((idbWiki) => {
                    if (isMounted && Array.isArray(idbWiki) && idbWiki.length > 0) {
                        setWikiArticles(normalizeWiki(idbWiki));
                    }
                }).catch(() => {});

                loadFromIDB('pruushkaa_tracks_v3').then((idbTracks) => {
                    if (isMounted && Array.isArray(idbTracks) && idbTracks.length > 0) {
                        setTracks(idbTracks);
                    }
                }).catch(() => {});

                const loadServerDatabase = async () => {
                    if (window.location.protocol === 'file:') return;
                    const bust = `t=${Date.now()}`;
                    const candidateUrls = [
                        `/api/data?${bust}`,
                        `./database.json?${bust}`,
                        `database.json?${bust}`,
                        `/database.json?${bust}`
                    ];
                    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                        if (window.location.port !== '3001') {
                            candidateUrls.unshift(`http://localhost:3001/api/data?${bust}`);
                        }
                    }

                    const data = await fetchFirstJson(candidateUrls, {
                        init: { cache: 'no-store', headers: { 'Pragma': 'no-cache', 'Cache-Control': 'no-cache' } },
                        accept: Boolean
                    });
                    if (!data || !isMounted) return;

                    if (Array.isArray(data.photos) && data.photos.length > 0) {
                        const normalized = normalizePhotos(data.photos);
                        setPhotos(normalized);
                        persistAllPhotos(normalized);
                    }

                    const serverWiki = Array.isArray(data.wiki)
                        ? data.wiki
                        : (Array.isArray(data.articles) ? data.articles : null);
                    if (serverWiki && serverWiki.length > 0) {
                        const normalizedW = normalizeWiki(serverWiki);
                        setWikiArticles(normalizedW);
                        persistAllWiki(normalizedW);
                    }

                    if (Array.isArray(data.tracks) && data.tracks.length > 0) {
                        setTracks(data.tracks);
                        persistAllTracks(data.tracks);
                    }
                    if (data.lastFmApiKey !== undefined && data.lastFmApiKey !== '') {
                        setLastFmApiKey(data.lastFmApiKey);
                    }
                    if (data.lastFmUser && data.lastFmUser !== '') {
                        setLastFmUser(data.lastFmUser);
                    }
                    if (data.discord) {
                        if (data.discord.status) {
                            setDiscordStatus(data.discord.status);
                        }
                        if (data.discord.text) {
                            setDiscordText(data.discord.text);
                        }
                        const dId = data.discord.discordId !== undefined ? data.discord.discordId : data.discord.id;
                        if (dId !== undefined && dId !== '') {
                            setDiscordId(dId);
                        }
                    } else if (data.discordStatus) {
                        setDiscordText(data.discordStatus);
                    }
                };

                const loadTracksManifest = async () => {
                    const bust = `?t=${Date.now()}`;
                    const data = await fetchFirstJson(
                        TRACK_MANIFEST_URLS.map((url) => url + bust),
                        { accept: (json) => Array.isArray(json) && json.length > 0 }
                    );
                    if (data && isMounted) setTracks(data);
                };

                loadTracksManifest();
                const syncInterval = setInterval(() => {
                    loadServerDatabase().catch(() => {});
                }, 15000);
                return () => {
                    isMounted = false;
                    clearInterval(syncInterval);
                };
            }, []);

            useEffect(() => {
                if (darkMode) {
                    document.body.classList.add('theme-cyber');
                    document.body.classList.remove('theme-light');
                    localStorage.setItem('archive_theme', 'cyber');
                } else {
                    document.body.classList.remove('theme-cyber');
                    document.body.classList.add('theme-light');
                    localStorage.setItem('archive_theme', 'light');
                }
            }, [darkMode]);

            useEffect(() => {
                const onKeyDown = (e) => {
                    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                        e.preventDefault();
                        sfx.playClick();
                        setCmdOpen(prev => !prev);
                    } else if (e.key === 'Escape') {
                        setCmdOpen(false);
                    }

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                console.error("ErrorBoundary caught:", error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div style={{ padding: '24px', fontFamily: 'monospace', background: '#F4F0EA', minHeight: '100vh', color: '#000', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                            <div style={{ maxWidth: '600px', border: '4px solid #000', padding: '24px', background: '#fff', boxShadow: '8px 8px 0px #000' }}>
                                <div style={{ background: '#FF5722', color: '#fff', padding: '6px 12px', fontWeight: '900', display: 'inline-block', marginBottom: '12px' }}>
                                    SYS_ERROR // ОШИБКА ИНТЕРФЕЙСА
                                </div>
                                <h2 style={{ fontSize: '18px', fontWeight: '900', marginBottom: '8px' }}>ПРОИЗОШЕЛ СБОЙ В КОМПОНЕНТЕ</h2>
                                <p style={{ fontSize: '12px', color: '#555', marginBottom: '16px' }}>{this.state.error?.message || 'Неизвестная ошибка рендеринга'}</p>
                                <button
                                    onClick={() => window.location.reload()}
                                    style={{ background: '#CCFF00', color: '#000', border: '3px solid #000', padding: '8px 16px', fontWeight: '900', cursor: 'pointer', boxShadow: '3px 3px 0px #000' }}
                                >
                                    ПЕРЕЗАГРУЗИТЬ СТРАНИЦУ
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
