<body class="min-h-screen relative selection:bg-[#FF5722] selection:text-white">

    <div id="root">
        <div class="min-h-screen flex items-center justify-center p-6 font-mono">
            <div class="bg-white border-4 border-black p-6 shadow-[8px_8px_0px_#000] max-w-md w-full">
                <div class="flex items-center justify-between border-b-2 border-black pb-3 mb-4">
                    <span class="font-extrabold text-sm tracking-widest uppercase">ARCHIVE_BOOT_LOADER v3.1</span>
                    <span class="w-3 h-3 bg-[#FF5722] border border-black animate-ping"></span>
                </div>
                <p class="text-xs font-bold mb-2">&gt; MOUNTING PRUUSHKAA_ARCHIVE...</p>
                <p class="text-xs text-neutral-600 mb-4">&gt; INITIALIZING AUDIO &amp; GLITCH CANVAS</p>
                <div class="w-full h-4 border-2 border-black bg-neutral-100 overflow-hidden p-0.5">
                    <div class="h-full bg-[#CCFF00] w-2/3 animate-pulse"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        const {
            CONFIG, SoundEngine, GlitchCanvas, triggerGlitchSpike, copyTextToClipboard,
            downloadFile, downloadUrl, formatClock, fetchFirstJson, fetchItunesPreview
        } = window.ArchiveCore;
        const { calculateTelemetry: calculateGpxTelemetry, formatDuration } = window.GpxUtils;

        const sfx = new SoundEngine('main');

        const GENRE_GRADIENTS = {
            electronic: 'linear-gradient(135deg, #FF5722 0%, #FF8A65 50%, #FFD54F 100%)',
            phonk: 'linear-gradient(135deg, #B388FF 0%, #FF5252 100%)',
            rock: 'linear-gradient(135deg, #FF5722 0%, #FCA5A5 100%)',
            ambient: 'linear-gradient(135deg, #80DEEA 0%, #CCFF00 100%)',
            synthwave: 'linear-gradient(135deg, #F48FB1 0%, #90CAF9 100%)',
            default: 'linear-gradient(135deg, #FFFFFF 0%, #FFF3E0 100%)'
        };

        const FALLBACK_TRACKS = [
            {
                name: "Kerosene",
                artist: "Crystal Castles",
                album: "(III)",
                image: "https://placehold.co/300x300/FF5722/000000?text=CRYSTAL+CASTLES",
                nowPlaying: true,
                duration: 192,
                tags: ["electronic", "witch house", "synthpop"],
                genreKey: "electronic",
                timestamp: "NOW SCR0BBLING"
            },
            {
                name: "resonance",
                artist: "HOME",
                album: "Odyssey",
                image: "https://placehold.co/300x300/00E5FF/000000?text=ODYSSEY",
                nowPlaying: false,
                duration: 212,
                tags: ["synthwave", "chillwave", "electronic"],
                genreKey: "synthwave",
                timestamp: "4m ago"
            }
        ];

        function detectGenreKeyFromTags(tags = []) {
            const joined = tags.join(' ').toLowerCase();
            if (joined.includes('phonk') || joined.includes('memphis') || joined.includes('hip-hop') || joined.includes('rap')) return 'phonk';
            if (joined.includes('synthwave') || joined.includes('retrowave') || joined.includes('chillwave') || joined.includes('vaporwave')) return 'synthwave';
            if (joined.includes('ambient') || joined.includes('idm') || joined.includes('downtempo') || joined.includes('piano') || joined.includes('lo-fi')) return 'ambient';
            if (joined.includes('rock') || joined.includes('metal') || joined.includes('punk') || joined.includes('shoegaze') || joined.includes('indie')) return 'rock';
            if (joined.includes('electronic') || joined.includes('witch house') || joined.includes('techno') || joined.includes('house') || joined.includes('electro')) return 'electronic';
            return 'electronic';
        }

        const LastFmWidget = ({ notify, lastFmApiKey, lastFmUser }) => {
            const [tracks, setTracks] = useState(FALLBACK_TRACKS);
            const [activeIdx, setActiveIdx] = useState(0);
            const [showHistory, setShowHistory] = useState(false);
            const [progress, setProgress] = useState(48);
            const [isPlayingSample, setIsPlayingSample] = useState(false);
            const [loadingSample, setLoadingSample] = useState(false);
            const [sampleUrl, setSampleUrl] = useState(null);
            const [apiStatus, setApiStatus] = useState('STANDBY'); // 'LIVE' | 'OFFLINE' | 'STANDBY' | 'ERROR'
            const [errorMsg, setErrorMsg] = useState(null);
            const audioRef = useRef(null);

            const isKeyConfigured = (key) => {
                if (!key) return false;
                const str = String(key).trim();
                return str && str !== 'ВАШ_LASTFM_API_KEY' && str !== 'YOUR_API_KEY' && str.length >= 16;
            };

            const cleanKey = (lastFmApiKey || CONFIG.LASTFM_API_KEY || '').trim();
            const cleanUser = (lastFmUser || CONFIG.LASTFM_USER || 'Pruushkaa').trim();

            const currentTrack = tracks[activeIdx] || tracks[0];

            useEffect(() => {
                let isMounted = true;

                if (!isKeyConfigured(cleanKey)) {
                    console.warn(`[Last.fm Widget] API-ключ Last.fm не настроен или содержит шаблонную заглушку ("${cleanKey || 'пусто'}"). Укажите валидный API-ключ в config.js (получить бесплатно: https://www.last.fm/api/account/create).`);
                    if (isMounted) {
                        setApiStatus('CONFIG_REQUIRED');
                    }
                    return;
                }

                const fetchLiveScrobble = async () => {
                    try {
                        const url = `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${encodeURIComponent(cleanUser)}&api_key=${encodeURIComponent(cleanKey)}&format=json&limit=4`;
                        const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
                        if (!res.ok) {
                            throw new Error(`Last.fm HTTP ${res.status}`);
                        }
                        const data = await res.json();
                        if (data?.error) {
                            throw new Error(data.message || 'Ошибка Last.fm API');
                        }

                        const rawList = data?.recenttracks?.track;
                        const trackList = Array.isArray(rawList) ? rawList : (rawList ? [rawList] : []);

                        if (trackList.length > 0) {
                            const parsed = trackList.slice(0, 4).map((item, idx) => {
                                const trackName = String(item.name || 'Unknown Track');
                                const artistName = String(item.artist?.['#text'] || item.artist?.name || item.artist || 'Unknown Artist');
                                const albumName = String(item.album?.['#text'] || item.album?.name || 'Single');
                                const isNow = Boolean(item['@attr']?.nowplaying === 'true');
                                const trackUrl = item.url || `https://www.last.fm/music/${encodeURIComponent(artistName)}/_/${encodeURIComponent(trackName)}`;

                                // Извлечение обложки максимального доступного разрешения
                                const images = Array.isArray(item.image) ? item.image : [];
                                const extraLarge = images.find(img => img.size === 'extralarge')?.['#text'];
                                const large = images.find(img => img.size === 'large')?.['#text'];
                                const medium = images.find(img => img.size === 'medium')?.['#text'];
                                let imgUrl = extraLarge || large || medium || (images[images.length - 1]?.['#text']) || '';

                                // Fallback если обложка пустая или дефолтная заглушка Last.fm
                                if (!imgUrl || imgUrl.includes('2a96cbd8b46e442fc41c2b86b821562f')) {
                                    imgUrl = `https://placehold.co/300x300/121212/FF5722?text=${encodeURIComponent(artistName.slice(0, 12))}`;
                                }

                                const dateStr = item.date?.['#text'] || '';

                                return {
                                    name: trackName,
                                    artist: artistName,
                                    album: albumName,
                                    image: imgUrl,
                                    nowPlaying: isNow,
                                    url: trackUrl,
                                    duration: 195,
                                    tags: ['last.fm', isNow ? 'live' : 'recent'],
                                    genreKey: 'electronic',
                                    timestamp: isNow ? 'NOW SCROBBLING' : (dateStr || 'ПОСЛЕДНИЙ ТРЕК')
                                };
                            });

                            if (isMounted) {
                                setTracks(parsed);
                                setApiStatus(parsed[0].nowPlaying ? 'LIVE' : 'OFFLINE');
                                setErrorMsg(null);
                            }
                        }
                    } catch (err) {
                        if (isMounted) {
                            setApiStatus('ERROR');
                            setErrorMsg(err.message || 'Ошибка сети');
                        }
                    }
                };

                fetchLiveScrobble();
                const pollTimer = setInterval(fetchLiveScrobble, CONFIG.LASTFM_POLL_INTERVAL_MS || 15000);
                return () => {
                    isMounted = false;
                    clearInterval(pollTimer);
                };
            }, [cleanKey, cleanUser]);

            useEffect(() => {
                const timer = setInterval(() => {
                    setProgress(prev => (prev >= (currentTrack?.duration || 180) ? 0 : prev + 1));
                }, 1000);
                return () => clearInterval(timer);
            }, [currentTrack]);

            useEffect(() => {
                if (audioRef.current) {
                    audioRef.current.pause();
                    audioRef.current = null;
                }
                setIsPlayingSample(false);
                setSampleUrl(null);
                setProgress(32);
            }, [activeIdx]);

            const toggleAudioSample = async () => {
                sfx.playClick();
                triggerGlitchSpike(0.7);

                if (isPlayingSample && audioRef.current) {
                    audioRef.current.pause();
                    setIsPlayingSample(false);
                    return;
                }

                if (sampleUrl && audioRef.current) {
                    audioRef.current.play();
                    setIsPlayingSample(true);
                    return;
                }

                setLoadingSample(true);
                try {
                    const preview = await fetchItunesPreview(currentTrack.artist, currentTrack.name);

                    if (preview) {
                        const audio = new Audio(preview);
                        audio.volume = 0.5;
                        audio.onended = () => setIsPlayingSample(false);
                        audioRef.current = audio;
                        setSampleUrl(preview);
                        await audio.play();
                        setIsPlayingSample(true);
                        notify(`ПЛЕЕР: 30С СЭМПЛ ${currentTrack.name.toUpperCase()}`);
                    } else {
                        notify("СЭМПЛ НЕ НАЙДЕН В ITUNES", "warn");
                    }
                } catch (e) {
                    notify("АУДИО-ПОТОК НЕДОСТУПЕН", "warn");
                } finally {
                    setLoadingSample(false);
                }
            };

            const pct = Math.min(100, Math.round((progress / (currentTrack.duration || 180)) * 100));
            const bgGradient = GENRE_GRADIENTS[currentTrack.genreKey] || GENRE_GRADIENTS.default;
            const isLongTitle = `${currentTrack.name} — ${currentTrack.artist}`.length > 26;

            return (
                <div
                    className="brutal-card p-5 relative overflow-hidden transition-all duration-500 text-black"
                    style={{ background: bgGradient }}
                >
                    {/* Header */}
                    <div className="flex flex-wrap items-center justify-between gap-2 border-b-2 border-black pb-3 mb-4">
                        <div className="flex items-center gap-2">
                            <span className="inline-flex items-center justify-center w-6 h-6 bg-black text-white font-mono text-xs font-bold">
                                <i className="fa-brands fa-lastfm text-[#FF5722]"></i>
                            </span>
                            <span className="font-mono font-extrabold text-xs tracking-wider uppercase bg-white px-2 py-0.5 border-2 border-black">
                                LAST.FM // @{cleanUser}
                            </span>
                            <span
                                className={`font-mono text-[10px] font-extrabold uppercase px-2 py-0.5 border-2 border-black ${
                                    apiStatus === 'LIVE'
                                        ? 'bg-[#CCFF00] text-black'
                                        : apiStatus === 'OFFLINE'
                                        ? 'bg-white text-black'
                                        : apiStatus === 'CONFIG_REQUIRED'
                                        ? 'bg-amber-300 text-black'
                                        : 'bg-red-500 text-white'
                                }`}
                            >
                                {apiStatus === 'LIVE'
                                    ? '● LAST.FM: LIVE'
                                    : apiStatus === 'CONFIG_REQUIRED'
                                    ? '⚙ API STANDBY'
                                    : apiStatus === 'OFFLINE'
                                    ? '■ LAST.FM: ПОСЛЕДНИЙ ТРЕК'
                                    : '▲ ОШИБКА API'}
                            </span>
                        </div>

                        <div className="flex items-center gap-2">
                            {apiStatus === 'LIVE' ? (
                                <span className="inline-flex items-center gap-1.5 font-mono text-[11px] font-bold px-2.5 py-0.5 border-2 border-black bg-[#CCFF00] text-black">
                                    <span className="w-2 h-2 rounded-full bg-black animate-ping"></span>
                                    СЕЙЧАС ИГРАЕТ // NOW PLAYING
                                </span>
                            ) : apiStatus === 'CONFIG_REQUIRED' ? (
                                <span className="inline-flex items-center gap-1.5 font-mono text-[11px] font-bold px-2.5 py-0.5 border-2 border-black bg-amber-300 text-black">
                                    <span className="w-2 h-2 rounded-full bg-amber-600"></span>
                                    Требуется настройка API
                                </span>
                            ) : (
                                <span className="inline-flex items-center gap-1.5 font-mono text-[11px] font-bold px-2.5 py-0.5 border-2 border-black bg-white text-neutral-800">
                                    <span className="w-2 h-2 rounded-full bg-neutral-500"></span>
                                    ПОСЛЕДНИЙ ТРЕК // OFFLINE
                                </span>
                            )}
                        </div>
                    </div>

                    {/* Standby Banner if no API key */}
                    {apiStatus === 'CONFIG_REQUIRED' && (
                        <div className="bg-amber-100 text-black border-2 border-black p-3 mb-4 font-mono text-xs shadow-[3px_3px_0px_#000]">
                            <div className="flex items-center gap-2 mb-1">
                                <i className="fa-solid fa-triangle-exclamation text-amber-600 text-sm"></i>
                                <span className="font-extrabold uppercase">ТРЕБУЕТСЯ НАСТРОЙКА API LAST.FM</span>
                            </div>
                            <p className="text-[11px] font-medium leading-relaxed text-neutral-800">
                                Для живого отслеживания треков укажите ваш 32-значный API-ключ в файле <code>config.js</code> в поле <code>LASTFM_API_KEY</code>.
                            </p>
                            <div className="mt-2.5 flex flex-wrap items-center gap-2">
                                <a
                                    href="https://www.last.fm/api/account/create"
                                    target="_blank"
                                    rel="noreferrer"
                                    className="bg-black text-[#CCFF00] px-2.5 py-1 text-[10px] uppercase font-extrabold border border-black hover:bg-[#FF5722] hover:text-white inline-flex items-center gap-1"
                                >
                                    <i className="fa-solid fa-key"></i> Получить ключ бесплатно
                                </a>
                                <span className="text-[10px] font-bold text-neutral-600">
                                    (Файл конфигурации: <code>config.js</code>)
                                </span>
                            </div>
                        </div>
                    )}

                    {/* Main Track Card */}
                    <div className="flex flex-col sm:flex-row gap-4 items-start sm:items-center">
                        <div className="relative w-24 h-24 sm:w-28 sm:h-28 shrink-0 border-3 border-black shadow-[4px_4px_0px_#000] bg-white overflow-hidden group">
                            <img
                                src={currentTrack.image}
                                alt={currentTrack.name}
                                onError={(e) => {
                                    e.target.onerror = null;
                                    e.target.src = "https://placehold.co/300x300/121212/FF5722?text=NO+COVER";
                                }}
                                className="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105"
                            />
                            {isPlayingSample && (
                                <div className="absolute inset-0 bg-black/55 flex items-end justify-center gap-1 p-3">
                                    {[0.4, 0.7, 0.5, 0.9, 0.6].map((spd, i) => (
                                        <span
                                            key={i}
                                            className="w-2 bg-[#CCFF00] border border-black"
                                            style={{
                                                animation: `eq-bounce ${spd}s ease-in-out infinite`
                                            }}
                                        />
                                    ))}
                                </div>
                            )}
                        </div>

                        <div className="flex-1 min-w-0 w-full">
                            <div className="overflow-hidden border-2 border-black bg-white px-3 py-1.5 shadow-[3px_3px_0px_#000] mb-2 flex items-center justify-between gap-2">
                                <div className="min-w-0 flex-1">
                                    {isLongTitle ? (
                                        <div className="animate-marquee">
                                            <span className="font-extrabold text-lg sm:text-xl tracking-tight mr-8">
                                                {currentTrack.name} — {currentTrack.artist}
                                            </span>
                                            <span className="font-extrabold text-lg sm:text-xl tracking-tight mr-8">
                                                {currentTrack.name} — {currentTrack.artist}
                                            </span>
                                        </div>
                                    ) : (
                                        <h3 className="font-extrabold text-lg sm:text-xl tracking-tight truncate">
                                            {currentTrack.name}
                                        </h3>
                                    )}
                                </div>
                                {currentTrack.url && (
                                    <a
                                        href={currentTrack.url}
                                        target="_blank"
                                        rel="noreferrer"
                                        className="shrink-0 text-black hover:text-[#FF5722] p-1"
                                        title="Открыть трек на Last.fm"
                                    >
                                        <i className="fa-solid fa-arrow-up-right-from-square text-sm"></i>
                                    </a>
                                )}
                            </div>

                            <p className="font-mono text-xs sm:text-sm font-bold text-neutral-900 truncate mb-2">
                                АРТИСТ: <span className="underline decoration-2">{currentTrack.artist}</span> // АЛЬБОМ: {currentTrack.album}
                            </p>

                            <div className="flex flex-wrap gap-1.5 mb-3">
                                {currentTrack.tags.map((tag, idx) => (
                                    <span
                                        key={idx}
                                        className="font-mono text-[10px] font-bold uppercase px-2 py-0.5 bg-black text-white border border-black"
                                    >
                                        #{tag}
                                    </span>
                                ))}
                            </div>

                            <div className="space-y-1">
                                <div className="w-full h-4 bg-white border-2 border-black p-0.5 relative">
                                    <div
                                        className="h-full bg-[#FF5722] transition-all duration-500"
                                        style={{ width: `${pct}%` }}
                                    />
                                </div>
                                <div className="flex justify-between font-mono text-[11px] font-bold">
                                    <span>{formatClock(progress)}</span>
                                    <span>{ pct }% // {formatClock(currentTrack.duration)}</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Footer Controls */}
                    <div className="mt-4 pt-3 border-t-2 border-black flex flex-wrap items-center justify-between gap-2">
                        <div className="flex flex-wrap items-center gap-2">
                            <button
                                onClick={toggleAudioSample}
                                onMouseEnter={() => sfx.playHover()}
                                disabled={loadingSample}
                                className={`brutal-btn px-3 py-1.5 font-mono text-xs font-extrabold uppercase flex items-center gap-2 ${
                                    isPlayingSample ? 'bg-[#CCFF00] text-black' : 'bg-white text-black'
                                }`}
                            >
                                <i className={`fa-solid ${loadingSample ? 'fa-spinner fa-spin' : isPlayingSample ? 'fa-pause' : 'fa-play'}`}></i>

                    setTimeLeft((prev) => {

                            sfx.playSuccess();
                            triggerGlitchSpike(1.5);
                            const nextMode = mode === 'WORK' ? 'BREAK' : 'WORK';
                            setMode(nextMode);
                            setTimerRunning(false);
                            notify(`SESSION COMPLETE! SWITCHED TO ${nextMode} MODE.`);
                            return nextMode === 'WORK' ? 25 * 60 : 5 * 60;

                        return prev - 1;

                }, 1000);
                return () => clearInterval(timerInterval);

                    setPingHistory(prev => [...prev.slice(-7), latency]);
                    notify(`VPS LATENCY MEASURED: ${latency} ms`);

                    const simulated = Math.floor(15 + Math.random() * 14);

        const normalizePhotos = (arr) => arr.map((p, idx) => ({

        const uniqueId = (prefix) => `${prefix}-${Date.now()}-${Math.random().toString(36).substring(2, 7)}`;


        /* ==========================================================================
           INDEXEDDB PERMANENT STORAGE ENGINE (ДЛЯ БОЛЬШИХ ФОТО И GPX БЕЗ ЛИМИТОВ КВОТЫ)
           ========================================================================== */
        const IDB_DB_NAME = 'pruushkaa_permanent_storage';
        const IDB_STORE_NAME = 'tracks_store';

        const openIDB = () => new Promise((resolve) => {
            try {
                if (typeof indexedDB === 'undefined') return resolve(null);
                const req = indexedDB.open(IDB_DB_NAME, 1);
                req.onupgradeneeded = () => {
                    req.result.createObjectStore(IDB_STORE_NAME);
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => resolve(null);
            } catch (e) {
                resolve(null);
            }
        });

        const saveToIDB = async (key, val) => {
            try {
                const db = await openIDB();
                if (!db) return false;
                return new Promise((resolve) => {
                    const tx = db.transaction(IDB_STORE_NAME, 'readwrite');
                    const store = tx.objectStore(IDB_STORE_NAME);
                    store.put(val, key);
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = () => resolve(false);
                });
            } catch (e) {
                return false;
            }
        };

            try {
                const db = await openIDB();
                if (!db) return null;
                return new Promise((resolve) => {
                    const tx = db.transaction(IDB_STORE_NAME, 'readonly');
                    const store = tx.objectStore(IDB_STORE_NAME);
                    const req = store.get(key);
                    req.onsuccess = () => resolve(req.result || null);
                    req.onerror = () => resolve(null);
                });
            } catch (e) {
                return null;
            }
        };

        // Интеллектуальное сжатие загружаемых снимков (макс 1920px, JPEG 0.85) для ускорения галереи и экономии памяти
        const compressImageFile = (file, maxWidth = 1920, maxHeight = 1920, quality = 0.85) => {
            return new Promise((resolve) => {
                if (!file || !file.type || !file.type.startsWith('image/')) {
                    const r = new FileReader();
                    r.onload = (e) => resolve(e.target.result);
                    r.onerror = () => resolve(null);
                    r.readAsDataURL(file);
                    return;
                }
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let { width, height } = img;
                        if (width > maxWidth || height > maxHeight) {
                            if (width / maxWidth > height / maxHeight) {
                                height = Math.round((height * maxWidth) / width);
                                width = maxWidth;
                            } else {
                                width = Math.round((width * maxHeight) / height);
                                height = maxHeight;
                            }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        try {
                            const dataUrl = canvas.toDataURL('image/jpeg', quality);
                            resolve(dataUrl);
                        } catch (err) {
                            resolve(e.target.result);
                        }
                    };
                    img.onerror = () => resolve(e.target.result);
                    img.src = e.target.result;
                };
                reader.onerror = () => resolve(null);
                reader.readAsDataURL(file);
            });
        };

                content: `Основные положения и правила взаимодействия внутри СРП:

        function renderWikiMarkdown(content) {
            if (!content) return '';

            const formatInline = (str) => {
                if (!str) return '';
                return str
                    .replace(/\*\*(.*?)\*\*/g, '<strong class="font-black text-black bg-neutral-100 px-0.5">$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em class="italic">$1</em>')
                    .replace(/`([^`]+)`/g, '<code class="bg-black text-[#CCFF00] px-1 py-0.5 text-xs font-mono">$1</code>')
                    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer" class="text-[#FF5722] underline font-extrabold hover:text-black">$1</a>');
            };

            const rawLines = content.replace(/\r\n/g, '\n').split('\n');
            const htmlParts = [];
            let inList = false;
            let listType = 'ul';

            for (let i = 0; i < rawLines.length; i++) {
                const line = rawLines[i];
                const trimmed = line.trim();

                // 1. Image check: ![alt](url)
                const imgMatch = trimmed.match(/^!\[(.*?)\]\((.*?)\)$/);
                if (imgMatch) {
                    if (inList) { htmlParts.push(`</${listType}>`); inList = false; }
                    const alt = (imgMatch[1] || 'Иллюстрация архива СРП').trim();
                    const src = imgMatch[2].trim();
                    htmlParts.push(`
                        <div class="my-5 p-2.5 bg-[#F4F0EA] border-3 border-black shadow-[4px_4px_0px_#000]">
                            <div class="overflow-hidden bg-neutral-950 flex items-center justify-center border-2 border-black max-h-[520px]">
                                <img 
                                    src="${src}" 
                                    alt="${alt}" 
                                    class="w-full max-h-[500px] object-contain hover:scale-[1.01] transition-transform cursor-pointer"
                                    loading="lazy"
                                />
                            </div>
                            <div class="mt-2 flex items-center justify-between font-mono text-[11px] font-bold text-neutral-700 px-1">
                                <span>▲ ${alt}</span>
                                <span class="text-[10px] text-[#FF5722] uppercase font-extrabold">КЛИК ДЛЯ УВЕЛИЧЕНИЯ ⤢</span>
                            </div>
                        </div>
                    `);
                    continue;
                }

                // 2. Heading: # Heading or **# Heading** or ## Heading
                const headingMatch = trimmed.match(/^(?:\*\*)?(#{1,4})\s+(.*?)(?:\*\*)?$/);
                if (headingMatch) {
                    if (inList) { htmlParts.push(`</${listType}>`); inList = false; }
                    const level = headingMatch[1].length;
                    const hText = headingMatch[2].replace(/^\*+|\*+$/g, '').trim();
                    if (level === 1) {
                        htmlParts.push(`
                            <h1 class="text-xl sm:text-2xl font-black uppercase tracking-tight mt-6 mb-3 pb-2 border-b-3 border-black flex items-center gap-2">
                                <span class="w-3 h-3 bg-[#FF5722] border-2 border-black inline-block shrink-0"></span>
                                <span>${hText}</span>
                            </h1>
                        `);
                    } else if (level === 2) {
                        htmlParts.push(`
                            <h2 class="text-lg sm:text-xl font-black uppercase tracking-tight mt-5 mb-2.5 pb-1 border-b-2 border-black text-[#FF5722] flex items-center gap-2">
                                <span>// ${hText}</span>
                            </h2>
                        `);
                    } else {
                        htmlParts.push(`
                            <h3 class="text-base sm:text-lg font-extrabold uppercase mt-4 mb-2 text-black">
                                ${hText}
                            </h3>
                        `);
                    }
                    continue;
                }

                // 3. Unordered list: - item or * item or • item
                const ulMatch = trimmed.match(/^[-*•]\s+(.*)$/);
                if (ulMatch) {
                    if (!inList || listType !== 'ul') {
                        if (inList) htmlParts.push(`</${listType}>`);
                        htmlParts.push('<ul class="list-disc list-inside space-y-1.5 my-3 font-mono text-xs sm:text-sm pl-2">');
                        inList = true;
                        listType = 'ul';
                    }
                    let itemText = formatInline(ulMatch[1]);
                    htmlParts.push(`<li class="leading-relaxed font-bold text-neutral-800">${itemText}</li>`);
                    continue;
                }

                // 4. Ordered list: 1. item
                const olMatch = trimmed.match(/^(\d+)\.\s+(.*)$/);
                if (olMatch) {
                    if (!inList || listType !== 'ol') {
                        if (inList) htmlParts.push(`</${listType}>`);
                        htmlParts.push('<ol class="list-decimal list-inside space-y-1.5 my-3 font-mono text-xs sm:text-sm pl-2 font-bold">');
                        inList = true;
                        listType = 'ol';
                    }
                    let itemText = formatInline(olMatch[2]);
                    htmlParts.push(`<li class="leading-relaxed font-bold text-neutral-800">${itemText}</li>`);
                    continue;
                }

                if (inList) {
                    htmlParts.push(`</${listType}>`);
                    inList = false;
                }

                // 5. Empty line
                if (!trimmed) {
                    htmlParts.push('<div class="h-2"></div>');
                    continue;
                }

                // 6. Blockquote: > text
                if (trimmed.startsWith('>')) {
                    const qText = formatInline(trimmed.replace(/^>\s*/, ''));
                    htmlParts.push(`
                        <blockquote class="border-l-4 border-[#FF5722] bg-[#F4F0EA] p-3 my-3 font-mono text-xs italic font-bold">
                            ${qText}
                        </blockquote>
                    `);
                    continue;
                }

                // 7. Check for inline image if inside text
                if (trimmed.includes('![') && trimmed.includes('](')) {
                    let replacedLine = trimmed.replace(/!\[(.*?)\]\((.*?)\)/g, (m, alt, src) => {
                        return `<div class="my-4 p-2.5 bg-[#F4F0EA] border-3 border-black shadow-[4px_4px_0px_#000]"><div class="overflow-hidden bg-neutral-950 flex items-center justify-center border-2 border-black max-h-[520px]"><img src="${src}" alt="${alt || 'Иллюстрация'}" class="w-full max-h-[500px] object-contain cursor-pointer" loading="lazy" /></div><div class="mt-2 text-center font-mono text-[11px] font-bold text-neutral-700">▲ ${alt || 'Иллюстрация'}</div></div>`;
                    });
                    htmlParts.push(`<div class="mb-2 leading-relaxed text-neutral-800 font-mono text-xs sm:text-sm">${replacedLine}</div>`);
                    continue;
                }

                // 8. Subheading check (short lines like "Краткая информация", "Формирование коалиции")
                const isSubheading = trimmed.length < 50 && 
                    !/[.,;!?]$/.test(trimmed) && 
                    !trimmed.includes('http') && 
                    !trimmed.startsWith('(') &&
                    !trimmed.includes(':') &&
                    !trimmed.startsWith('<');

                if (isSubheading) {
                    htmlParts.push(`
                        <div class="font-extrabold uppercase text-sm sm:text-base mt-4 mb-1.5 text-black font-mono flex items-center gap-2">
                            <span class="w-2.5 h-2.5 bg-[#CCFF00] border border-black inline-block shrink-0"></span>
                            <span>${formatInline(trimmed)}</span>
                        </div>
                    `);
                    continue;
                }

                // 9. Key: Value or normal paragraph
                let pText = formatInline(trimmed);
                const colonIdx = pText.indexOf(':');
                if (colonIdx > 0 && colonIdx < 40 && !pText.startsWith('<') && !pText.includes('http:')) {
                    const keyPart = pText.substring(0, colonIdx);
                    const valPart = pText.substring(colonIdx + 1);
                    pText = `<strong class="text-black font-extrabold">${keyPart}:</strong><span class="text-neutral-800 font-bold">${valPart}</span>`;
                }

                htmlParts.push(`
                    <p class="mb-2 leading-relaxed text-neutral-800 font-mono text-xs sm:text-sm">
                        ${pText}
                    </p>
                `);
            }

            if (inList) {
                htmlParts.push(`</${listType}>`);
            }

            return htmlParts.join('\n');
        }

                const markers = L.layerGroup().addTo(map);

                mapInstanceRef.current = map;
                tileLayerRef.current = tiles;
                markersLayerRef.current = markers;

                setTimeout(() => {
                    map.invalidateSize();
                }, 250);

                return () => {
                    map.remove();
                    mapInstanceRef.current = null;
                };
            }, []);

            // 2. Dynamic Tile Switch on Theme or Mode change
            useEffect(() => {
                if (!mapInstanceRef.current || !tileLayerRef.current) return;
                mapInstanceRef.current.removeLayer(tileLayerRef.current);
                const newTiles = L.tileLayer(currentTileConfig.url, {
                    maxZoom: currentTileConfig.maxZoom,
                    className: currentTileConfig.className,
                    attribution: currentTileConfig.attribution
                }).addTo(mapInstanceRef.current);
                if (typeof newTiles.bringToBack === 'function') {
                    newTiles.bringToBack();
                }
                tileLayerRef.current = newTiles;
            }, [currentTileConfig]);

            // 3. Render GPX Track Layer & Custom SVG Markers
            const renderTrack = useCallback((track) => {
                if (!track || !mapInstanceRef.current) return;
                if (typeof L === 'undefined' || typeof L.GPX === 'undefined') {
                    setMapError('Библиотека leaflet-gpx не загружена.');
                    return;
                }

                setIsLoadingTrack(true);
                setMapError(null);

                const map = mapInstanceRef.current;

                // Remove previous track & markers from memory
                if (gpxLayerRef.current) {
                    map.removeLayer(gpxLayerRef.current);
                    gpxLayerRef.current = null;
                }
                if (markersLayerRef.current) {
                    markersLayerRef.current.clearLayers();
                }

                let trackSource = track.rawGpx || track.file;
                if (!trackSource) {
                    setIsLoadingTrack(false);
                    setMapError('Файл трека отсутствует.');
                    return;
                }

                // Strictly use site primary accent color #FF5722
                const accentColor = '#FF5722';

                try {
                    const gpx = new L.GPX(trackSource, {
                        async: true,
                        marker_options: {
                            startIconUrl: null,
                            endIconUrl: null,
                            shadowUrl: null,
                            wptIconUrls: { '': null }
                        },
                        polyline_options: {
                            color: accentColor,
                            opacity: 0.95,
                            weight: 3.5,
                            lineCap: 'round',
                            lineJoin: 'round'
                        }
                    });

                    gpx.on('loaded', (e) => {
                        const g = e.target;
                        if (!mapInstanceRef.current) return;

                        // Fly smoothly to track bounds
                        const bounds = g.getBounds();
                        if (bounds && bounds.isValid()) {
                            mapInstanceRef.current.flyToBounds(bounds, {
                                padding: [45, 45],
                                duration: 1.1,
                                easeLinearity: 0.25
                            });
                        }

                        // Extract start & finish points for custom minimalist SVG markers
                        let startPoint = null;
                        let endPoint = null;
                        let minEle = 99999;
                        let maxEle = -99999;
                        let totalPoints = 0;

                        const layers = g.getLayers();
                        for (const l of layers) {
                            if (typeof l.getLatLngs === 'function') {
                                const latlngs = l.getLatLngs();
                                const flat = Array.isArray(latlngs[0]) ? latlngs.flat(Infinity) : latlngs;
                                if (flat.length > 0) {
                                    startPoint = flat[0];
                                    endPoint = flat[flat.length - 1];
                                    totalPoints += flat.length;
                                    for (const p of flat) {
                                        if (p.meta && typeof p.meta.ele === 'number') {
                                            if (p.meta.ele < minEle) minEle = p.meta.ele;
                                            if (p.meta.ele > maxEle) maxEle = p.meta.ele;
                                        }
                                    }
                                }
                            }
                        }

                        // Add custom Start SVG Marker (Lime pulse)
                        if (markersLayerRef.current && startPoint) {
                            const startIcon = L.divIcon({
                                className: 'gpx-pin-start',
                                iconSize: [28, 28],
                                iconAnchor: [14, 14],
                                html: `<div style="position:relative;width:28px;height:28px;display:flex;align-items:center;justify-content:center;">
                                    <div style="position:absolute;inset:0;border-radius:50%;background:#CCFF00;opacity:0.35;animation:ping 1.5s cubic-bezier(0,0,0.2,1) infinite;"></div>
                                    <div style="width:20px;height:20px;background:#CCFF00;border:2.5px solid #000;box-shadow:2px 2px 0 #000;display:flex;align-items:center;justify-content:center;color:#000;font-size:10px;font-weight:900;font-family:'Space Grotesk',sans-serif;">
                                        S
                                    </div>
                                </div>`
                            });
                            const m1 = L.marker(startPoint, { icon: startIcon }).bindTooltip(`СТАРТ: ${track.title}`, { direction: 'top', offset: [0, -10], className: 'brutal-tooltip' });
                            markersLayerRef.current.addLayer(m1);
                        }

                        // Add custom Finish SVG Marker (Accent orange)
                        if (markersLayerRef.current && endPoint) {
                            const endIcon = L.divIcon({
                                className: 'gpx-pin-end',
                                iconSize: [28, 28],
                                iconAnchor: [14, 14],
                                html: `<div style="position:relative;width:28px;height:28px;display:flex;align-items:center;justify-content:center;">
                                    <div style="width:20px;height:20px;background:#FF5722;border:2.5px solid #000;box-shadow:2px 2px 0 #000;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:900;font-family:'Space Grotesk',sans-serif;">
                                        F
                                    </div>
                                </div>`
                            });
                            const m2 = L.marker(endPoint, { icon: endIcon }).bindTooltip(`ФИНИШ: ${track.title}`, { direction: 'top', offset: [0, -10], className: 'brutal-tooltip' });
                            markersLayerRef.current.addLayer(m2);
                        }

                        // Calculate and update telemetry
                        const distM = typeof g.get_distance === 'function' ? g.get_distance() : 0;
                        const gainM = typeof g.get_elevation_gain === 'function' ? g.get_elevation_gain() : 0;
                        const lossM = typeof g.get_elevation_loss === 'function' ? g.get_elevation_loss() : 0;
                        const moveMs = typeof g.get_moving_time === 'function' && g.get_moving_time() > 0 ? g.get_moving_time() : (typeof g.get_total_time === 'function' ? g.get_total_time() : 0);
                        const speedKmh = typeof g.get_moving_speed === 'function' && g.get_moving_speed() > 0
                            ? g.get_moving_speed() * 3.6
                            : (distM > 0 && moveMs > 0 ? ((distM / 1000) / (moveMs / 3600000)) : 0);

                        const formattedTime = formatDuration(Math.round(moveMs / 1000), true);

                        const telemetry = {
                            distanceKm: (distM / 1000).toFixed(1),
                            elevationGainM: Math.round(gainM),
                            elevationLossM: Math.round(lossM),
                            movingTime: formattedTime,
                            avgSpeed: speedKmh > 0 ? speedKmh.toFixed(1) : null,
                            pointsCount: totalPoints,
                            minEle: minEle < 90000 ? Math.round(minEle) : null,
                            maxEle: maxEle > -90000 ? Math.round(maxEle) : null
                        };

                        setActiveTelemetry(telemetry);
                        setIsLoadingTrack(false);
                    });

                    gpx.on('error', (err) => {
                        console.error('GPX load error for:', trackSource, err);
                        if (typeof trackSource === 'string' && !trackSource.startsWith('<') && !track._retried) {
                            let altSource = null;
                            if (trackSource.includes('public/tracks/')) {
                                altSource = trackSource.replace('public/tracks/', 'tracks/');
                            } else if (trackSource.includes('tracks/')) {
                                altSource = trackSource.replace('tracks/', 'public/tracks/');
                            }
                            if (altSource && altSource !== trackSource) {
                                console.info('Retrying GPX with alternative path:', altSource);
                                renderTrack({ ...track, file: altSource, _retried: true });
                                return;
                            }
                        }
                        setMapError(`Не удалось загрузить .gpx файл [${track.title}]. Проверьте файл.`);
                        setIsLoadingTrack(false);
                        notify('ОШИБКА ЗАГРУЗКИ GPX ФАЙЛА', 'warn');
                    });

                    gpx.addTo(map);
                    gpxLayerRef.current = gpx;

                } catch (e) {
                    console.error('GPX init exception:', e);
                    setMapError(e.message);
                    setIsLoadingTrack(false);
                }
            }, [notify]);

            // Re-render when selected track changes
            useEffect(() => {
                if (currentTrack && mapInstanceRef.current) {
                    renderTrack(currentTrack);
                }
            }, [currentTrack, renderTrack]);

            // File Drag & Drop & Upload logic - In-memory local preview (does not overwrite static repo manifest)
            const handleMultipleGpxFiles = async (files) => {
                if (!files || files.length === 0) return;
                const fileList = Array.isArray(files) ? files : Array.from(files);
                const gpxList = fileList.filter(f => f.name && f.name.toLowerCase().endsWith('.gpx'));
                if (gpxList.length === 0) {
                    notify('ТРЕБУЮТСЯ ФАЙЛЫ В ФОРМАТЕ .GPX', 'warn');
                    return;
                }

                setIsLoadingTrack(true);
                const newPreviewList = [];
                for (const file of gpxList) {
                    try {
                        const text = await file.text();
                        const cleanTitle = gpxFileTitle(file.name);
                        const today = todayISO();
                        const previewId = uniqueId('preview');
                        const stats = calculateGpxTelemetry(text);

                        newPreviewList.push({
                            id: previewId,
                            title: cleanTitle,
                            date: today,
                            file: null,
                            rawGpx: text,
                            fileName: file.name,
                            description: `Локальный предпросмотр [${file.name}], ${(file.size / 1024).toFixed(1)} КБ (только в вашем браузере)`,
                            tags: ['предпросмотр', 'локально'],
                            telemetry: stats,
                            isLocal: true,
                            isPreview: true
                        });
                    } catch (err) {
                        console.error('Ошибка чтения GPX:', file.name, err);
                    }
                }

                if (newPreviewList.length === 0) {
                    setIsLoadingTrack(false);
                    return;
                }

                setLocalPreviewTracks(prev => [...newPreviewList, ...prev]);
                setSelectedTrackId(newPreviewList[0].id);
                setIsLoadingTrack(false);
                sfx.playSuccess();
                triggerGlitchSpike(1.2);
                notify(`ОТКРЫТ ПРЕДПРОСМОТР: ${newPreviewList.length} ФАЙЛ(ОВ)`);
            };

            const handleGpxFile = (file) => {
                if (file) handleMultipleGpxFiles([file]);
            };

            const onDragOver = (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (!isDraggingOver) setIsDraggingOver(true);
            };

            const onDragLeave = (e) => {
                e.preventDefault();
                e.stopPropagation();
                setIsDraggingOver(false);
            };

            const onDrop = (e) => {
                e.preventDefault();
                e.stopPropagation();
                setIsDraggingOver(false);
                const files = Array.from(e.dataTransfer.files || []);
                if (files.length > 0) handleMultipleGpxFiles(files);
            };

            // Download GPX
            const handleDownloadGpx = () => {
                if (!currentTrack) return;
                sfx.playSuccess();
                if (currentTrack.rawGpx) {
                    downloadFile(currentTrack.rawGpx, `${currentTrack.id}.gpx`, 'application/gpx+xml');
                } else if (currentTrack.file) {
                    downloadUrl(currentTrack.file, `${currentTrack.id}.gpx`);
                }
                notify(`СКАЧИВАНИЕ .GPX [${currentTrack.title}]...`);
            };

            // Recenter
            const handleRecenter = () => {
                if (!gpxLayerRef.current || !mapInstanceRef.current) return;
                sfx.playClick();
                const bounds = gpxLayerRef.current.getBounds();
                if (bounds && bounds.isValid()) {
                    mapInstanceRef.current.flyToBounds(bounds, { padding: [45, 45] });
                }
            };

            // Close local preview track
            const handleRemovePreviewTrack = (id) => {
                sfx.playClick();
                setLocalPreviewTracks(prev => {
                    const next = prev.filter(t => t.id !== id);
                    if (selectedTrackId === id) {
                        setSelectedTrackId(next[0]?.id || tracks[0]?.id || null);
                    }
                    return next;
                });
                notify('ЛОКАЛЬНЫЙ ТРЕК ЗАКРЫТ');
            };

            // Current display telemetry (prefer live computed, fallback to manifest)
            const displayTelemetry = activeTelemetry || currentTrack?.telemetry || {
                distanceKm: '--',
                elevationGainM: '--',
                movingTime: '--'
            };

            return (
                <section className="brutal-card p-5 bg-white text-black">
                    {/* Header */}
                    <div className="flex flex-wrap items-center justify-between gap-3 border-b-2 border-black pb-3 mb-4">
                        <div className="flex items-center gap-2.5">
                            <span className="px-2 py-0.5 bg-[#FF5722] text-white font-mono text-xs font-extrabold border-2 border-black">
                                GPX_VIEWER.DB
                            </span>
                            <h2 className="font-extrabold text-lg sm:text-xl uppercase tracking-tight">
                                КАРТА МАРШРУТОВ // GPX АРХИВ
                            </h2>
                        </div>

                        <div className="flex flex-wrap items-center gap-2 font-mono text-xs">
                            <span className="px-2 py-1 bg-[#F4F0EA] border-2 border-black font-bold">
                                МАРШРУТОВ: {allTracks.length}
                            </span>

                            <button
                                onClick={() => fileInputRef.current?.click()}
                                onMouseEnter={() => sfx.playHover()}
                                className="brutal-btn bg-[#CCFF00] text-black px-3 py-1 font-extrabold uppercase flex items-center gap-1.5"
                                title="Открыть .gpx файл с ПК в режиме локального предпросмотра"
                            >
                                <i className="fa-solid fa-file-arrow-up text-black"></i>
                                <span>ПРЕДПРОСМОТР .GPX</span>
                            </button>
                            <input
                                ref={fileInputRef}
                                type="file"
                                accept=".gpx,application/gpx+xml"
                                multiple
                                onChange={(e) => {
                                    const files = Array.from(e.target.files || []);
                                    if (files.length > 0) handleMultipleGpxFiles(files);
                                    e.target.value = '';
                                }}
                                className="hidden"
                            />
                        </div>
                    </div>

                    {/* Filter & Categories Bar */}
                    <div className="flex flex-wrap items-center justify-between gap-2 mb-4 font-mono text-xs">
                        <div className="flex flex-wrap gap-1.5">
                            {categories.map((cat) => (
                                <button
                                    key={cat}
                                    onClick={() => {
                                        sfx.playClick();
                                        setSelectedCategory(cat);
                                    }}
                                    onMouseEnter={() => sfx.playHover()}
                                    className={`brutal-btn px-2.5 py-1 font-bold uppercase ${
                                        selectedCategory === cat
                                            ? 'bg-[#FF5722] text-white shadow-[2px_2px_0px_#000]'
                                            : 'bg-[#F4F0EA] text-black'
                                    }`}
                                >
                                    {cat === 'local' ? '📁 ЛОКАЛЬНЫЕ' : `#${cat}`}
                                </button>
                            ))}
                        </div>

                        <div className="relative w-full sm:w-64">
                            <input
                                type="text"
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                placeholder="Поиск по маршрутам..."
                                className="w-full p-2 pl-7 border-2 border-black bg-[#F4F0EA] font-bold text-xs focus:outline-none"
                            />
                            <i className="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-neutral-500 text-[11px]"></i>
                        </div>
                    </div>

                    {/* Two-column layout: Left Archive Cards, Right Map */}
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
                        {/* LEFT COLUMN: Dropzone & Route Cards */}
                        <div className="lg:col-span-5 flex flex-col space-y-3 font-mono text-xs">
                            {/* Drag and Drop Zone */}
                            <div
                                onDragOver={onDragOver}
                                onDragLeave={onDragLeave}
                                onDrop={onDrop}
                                onClick={() => fileInputRef.current?.click()}
                                className={`gpx-dropzone p-3.5 text-center cursor-pointer select-none transition-all ${
                                    isDraggingOver
                                        ? 'drag-active'
                                        : 'bg-[#F4F0EA] hover:bg-neutral-200 shadow-[3px_3px_0px_#000]'
                                }`}
                            >
                                <div className="flex items-center justify-center gap-2 font-extrabold uppercase">
                                    <i className="fa-solid fa-cloud-arrow-up text-[#FF5722] text-sm"></i>
                                    <span>ЛОКАЛЬНЫЙ ПРЕДПРОСМОТР .GPX (DRAG & DROP)</span>
                                </div>
                                <div className="text-[10px] text-neutral-600 font-bold mt-1">
                                    Перетащите .gpx файл для мгновенного анализа на карте (без перезаписи репозитория)
                                </div>
                            </div>

                            {/* Local Preview Info Banner */
                            localPreviewTracks.length > 0 && (
                                <div className="p-2.5 bg-[#CCFF00] border-2 border-black text-black font-mono text-[11px] font-bold flex flex-wrap items-center justify-between gap-2 shadow-[2px_2px_0px_#000]">
                                    <div className="flex items-center gap-2">
                                        <i className="fa-solid fa-eye text-black"></i>
                                        <span>Локальных файлов: <b>{localPreviewTracks.length}</b> (предпросмотр)</span>
                                    </div>
                                </div>
                            )}

                            {/* Cards List Header */}
                            <div className="flex items-center justify-between text-[11px] font-extrabold uppercase px-1 text-neutral-600">
                                <span>РЕЕСТР МАРШРУТОВ ({filteredTracks.length}):</span>
                                <span>КЛИК ДЛЯ ПЕРЕХОДА НА КАРТЕ</span>
                            </div>

                            {/* Scrollable list of cards */}
                            <div className="space-y-3 max-h-[620px] overflow-y-auto pr-1">
                                {filteredTracks.length === 0 ? (
                                    <div className="p-4 bg-white border-2 border-black text-center font-bold">
                                        МАРШРУТЫ НЕ НАЙДЕНЫ
                                    </div>
                                ) : (
                                    filteredTracks.map((item) => {
                                        const isSelected = currentTrack?.id === item.id;
                                        const tDist = item.telemetry?.distanceKm || (isSelected ? activeTelemetry?.distanceKm : null) || '--';
                                        const tGain = item.telemetry?.elevationGainM || (isSelected ? activeTelemetry?.elevationGainM : null) || '--';
                                        const tTime = item.telemetry?.movingTime || (isSelected ? activeTelemetry?.movingTime : null) || '--';

                                        return (
                                            <div
                                                key={item.id}
                                                onClick={() => {
                                                    sfx.playClick();
                                                    setSelectedTrackId(item.id);
                                                    triggerGlitchSpike(0.4);
                                                }}
                                                onMouseEnter={() => sfx.playHover()}
                                                className={`brutal-card brutal-card-interactive p-3.5 cursor-pointer transition-all ${
                                                    isSelected
                                                        ? 'border-3 border-[#FF5722] shadow-[5px_5px_0px_#FF5722] bg-[#FF5722]/5'
                                                        : 'bg-white hover:bg-neutral-50'
                                                }`}
                                            >
                                                {/* Card Header */}
                                                <div className="flex items-center justify-between font-mono text-[11px] font-bold mb-1.5">
                                                    <div className="flex items-center gap-1.5">
                                                        <span className="bg-black text-white px-1.5 py-0.5 text-[10px]">
                                                            {item.id}
                                                        </span>
                                                        {item.isPreview && (
                                                            <span className="bg-[#CCFF00] text-black border border-black px-1.5 py-0.5 text-[9px] font-black">
                                                                ПРЕДПРОСМОТР (ЛОКАЛЬНО)
                                                            </span>
                                                        )}
                                                    </div>
                                                    <div className="flex items-center gap-1.5">
                                                        {isSelected && (
                                                            <span className="bg-[#FF5722] text-white px-1.5 py-0.5 text-[9px] font-extrabold flex items-center gap-1 animate-pulse">
                                                                <span className="w-1.5 h-1.5 bg-[#CCFF00] inline-block rounded-full"></span>
                                                                АКТИВЕН
                                                            </span>
                                                        )}
                                                        <span className="bg-white border border-black px-1.5 py-0.5 text-[10px]">
                                                            {item.date}
                                                        </span>
                                                    </div>
                                                </div>

                                                {/* Title */}
                                                <h3 className="font-extrabold text-sm sm:text-base uppercase tracking-tight mb-1 text-black">
                                                    {item.title}
                                                </h3>

                                                {/* Telemetry Grid */}
                                                <div className="grid grid-cols-3 gap-1.5 my-2 p-1.5 bg-[#F4F0EA] border-2 border-black text-center font-mono">
                                                    <div>
                                                        <div className="text-[9px] font-bold text-neutral-500 uppercase">ДИСТАНЦИЯ</div>
                                                        <div className="font-extrabold text-[#FF5722] text-xs">
                                                            {tDist} {tDist !== '--' ? 'км' : ''}
                                                        </div>
                                                    </div>
                                                    <div>
                                                        <div className="text-[9px] font-bold text-neutral-500 uppercase">ПОДЪЕМ</div>
                                                        <div className="font-extrabold text-black text-xs">
                                                            {tGain !== '--' ? `+${tGain} м` : '--'}
                                                        </div>
                                                    </div>
                                                    <div>
                                                        <div className="text-[9px] font-bold text-neutral-500 uppercase">ВРЕМЯ</div>
                                                        <div className="font-extrabold text-neutral-900 text-xs">
                                                            {tTime}
                                                        </div>
                                                    </div>
                                                </div>

                                                {/* Description */}
                                                {item.description && (
                                                    <p className="text-[11px] font-bold text-neutral-700 mb-2 line-clamp-2 leading-relaxed">
                                                        {item.description}
                                                    </p>
                                                )}

                                                {/* Tags & Actions */}
                                                <div className="flex flex-wrap items-center justify-between gap-1 pt-1.5 border-t border-neutral-300">
                                                    <div className="flex flex-wrap items-center gap-1">
                                                        {(item.tags || []).map((t) => (
                                                            <span
                                                                key={t}
                                                                className="px-1.5 py-0.5 bg-black text-[#CCFF00] font-mono text-[9px] font-bold"
                                                            >
                                                                #{t}
                                                            </span>
                                                        ))}

                                                        {item.isPreview ? (
                                                            <button
                                                                type="button"
                                                                onClick={(e) => {
                                                                    e.stopPropagation();
                                                                    handleRemovePreviewTrack(item.id);
                                                                }}
                                                                className="brutal-btn bg-neutral-200 text-red-600 hover:bg-red-600 hover:text-white px-1.5 py-0.5 text-[9px] font-extrabold uppercase ml-1"
                                                                title="Закрыть предпросмотр этого файла"
                                                            >
                                                                ✕ ЗАКРЫТЬ
                                                            </button>
                                                        ) : null}
                                                    </div>
                                                    <span className="text-[10px] font-extrabold text-[#FF5722] flex items-center gap-1 group-hover:translate-x-1 transition-transform">
                                                        ПОКАЗАТЬ <i className="fa-solid fa-arrow-right"></i>
                                                    </span>
                                                </div>
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        </div>

                        {/* RIGHT COLUMN: Leaflet Interactive Map */}
                        <div className="lg:col-span-7 flex flex-col font-mono">
                            <div className="brutal-card bg-[#0D0E12] border-3 border-black shadow-[6px_6px_0px_#000] overflow-hidden flex flex-col relative">
                                {/* Map Toolbar */}
                                <div className="bg-black text-white p-2.5 px-3 border-b-3 border-black flex flex-wrap items-center justify-between gap-2 text-xs">
                                    <div className="flex items-center gap-2 truncate">
                                        <span className="w-2.5 h-2.5 bg-[#FF5722] inline-block shrink-0"></span>
